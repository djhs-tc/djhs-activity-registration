<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#f6f4ed;color:#214237;font:16px system-ui,"Noto Sans TC",sans-serif}main{max-width:850px;margin:35px auto;padding:0 18px}h1{font-size:32px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:22px;margin:16px 0}label{display:block;font-weight:700;margin:10px 0 5px}input,select,textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #becbc2}button{background:#17624f;color:white;border:0;font-weight:700;margin-top:14px;cursor:pointer}button:disabled{opacity:.55}small{color:#61776d}#msg{white-space:pre-wrap;margin:14px 0} .error{color:#b03030}.ok{color:#116747}hr{border:0;border-top:1px solid #ddd;margin:23px 0} .date-time{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}.date-time input{min-width:0}@media(max-width:520px){.date-time{grid-template-columns:1fr}} .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{width:auto;margin:0;padding:11px 17px;background:#e4eae5;color:#214237}.tabs button.active{background:#17624f;color:#fff}.muted{color:#66796f;font-size:14px;line-height:1.8}.section-title{margin:24px 0 8px}.status{display:inline-block;background:#e8f3ed;border-radius:20px;padding:5px 12px;font-size:13px}.card h2{margin-top:0} .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.empty{padding:22px;color:#63786c;background:white;border-radius:16px}.danger{background:#8e4937} </style></head><body><main><h1>大甲國中 · 活動報名</h1><p id="identity">正在確認登入身分…</p><div id="msg" role="status" aria-live="polite"></div><div id="content"></div></main><script>
let data;const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function run(name,args,success){el('msg').textContent='處理中…';el('msg').className='';let req=google.script.run.withSuccessHandler(x=>{el('msg').textContent='';success(x);}).withFailureHandler(e=>{el('msg').textContent=e.message||String(e);el('msg').className='error';});req[name](...args);}
function load(){run('getData',[],x=>{data=x;el('identity').textContent='登入帳號：'+x.viewer.email+(x.viewer.isAdmin?'（管理員）':'');render();});}

let activeTab='register';
function switchTab(tab){activeTab=tab;render();window.scrollTo({top:0,behavior:'smooth'});}
function createFormHTML(){const fields=[['title','活動名稱'],['speaker','講師'],['venue','地點'],['audience','參加對象'],['startsAt','活動開始（台灣時間）'],['endsAt','活動結束（台灣時間）'],['registrationOpensAt','開放報名時間'],['lotteryDeadline','抽籤報名截止時間'],['priorityQuota','優先錄取班數'],['lotteryQuota','抽籤名額']];
return '<section class="card"><h2>建立新活動</h2><p class="muted">設定活動基本資訊、報名期間及錄取名額。建立後才會出現在報名列表。</p><form onsubmit="eventForm(event)">'+fields.map(([k,v])=>'<label>'+v+'</label>'+(['startsAt','endsAt','registrationOpensAt','lotteryDeadline'].includes(k)?'<div class="date-time"><input aria-label="'+v+'日期" required type="date" name="'+k+'_date"><input aria-label="'+v+'時間" required type="time" step="60" name="'+k+'_time"></div>':'<input required name="'+k+'" type="'+(k.endsWith('Quota')?'number':'text')+'" value="'+(k==='priorityQuota'?'15':k==='lotteryQuota'?'3':'')+'">')).join('')+'<label>活動說明</label><textarea name="description" rows="5"></textarea><button>建立活動</button></form></section>';}
function render(){
 const admin=data.viewer.isAdmin,mine=data.mine||[];let h='';
 if(admin){h+='<nav class="tabs" aria-label="系統功能"><button type="button" class="'+(activeTab==='register'?'active':'')+'" onclick="switchTab(\'register\')">教師報名</button><button type="button" class="'+(activeTab==='manage'?'active':'')+'" onclick="switchTab(\'manage\')">活動管理與抽籤</button><button type="button" class="'+(activeTab==='new'?'active':'')+'" onclick="switchTab(\'new\')">＋ 建立活動</button></nav>';}
 if(admin&&activeTab==='new'){el('content').innerHTML=h+createFormHTML();return;}
 if(admin&&activeTab==='manage'){
   h+='<h2 class="section-title">活動管理</h2><p class="muted">查看報名狀況與抽籤名單。抽籤僅可在截止後執行一次。</p>';
   for(const e of data.events){
     h+='<section class="card"><div class="row"><h2>'+esc(e.title)+'</h2><span class="status">'+(e.state==='OPEN'?'報名開放':'已結束')+'</span></div><p class="muted">優先錄取 '+e.counts.priority+' / '+e.priorityQuota+' 班 ｜ 待抽籤 '+e.counts.waiting+' 班<br>抽籤報名截止：'+esc(e.lotteryDeadline)+'</p><h3>班級報名名單</h3><p>'+((e.registrations||[]).map(r=>esc(r.classCode)+'（'+esc(r.status)+'）').join('、')||'尚無報名')+'</p>';
     if(e.state==='OPEN')h+='<button class="danger" type="button" onclick="draw(\''+esc(e.id)+'\')">截止後執行抽籤</button>';
     h+='</section>';
   }
   el('content').innerHTML=h+(data.events.length?'':'<div class="empty">尚未建立活動，請切換到「建立活動」。</div>');return;
 }
 h+='<h2 class="section-title">開放報名活動</h2><p class="muted">請由班級導師填寫資料。錄取依報名時間與活動抽籤規則辦理。</p>';
 const list=data.events.filter(e=>e.state==='OPEN');
 for(const e of list){
   const own=mine.find(r=>r.eventId===e.id);
   h+='<section class="card"><h2>'+esc(e.title)+'</h2><p>'+esc(e.description||'')+'</p><p>講師：'+esc(e.speaker)+'<br>時間：'+esc(e.startsAt)+'<br>地點：'+esc(e.venue)+'</p><p class="muted">優先錄取 '+e.counts.priority+'/'+e.priorityQuota+' 班；待抽籤 '+e.counts.waiting+' 班<br>報名截止：'+esc(e.lotteryDeadline)+'</p>';
   if(own)h+='<p class="ok">您已登記 '+esc(own.classCode)+' 班，狀態：'+esc(own.status)+'</p>';
   else h+='<form onsubmit="registerForm(event,\''+esc(e.id)+'\')"><label>班級（例如 701）</label><input name="classCode" pattern="[789][0-9]{2}" required><label>導師姓名</label><input name="teacherName" required minlength="2"><label>是否隨班參加</label><select name="accompany"><option>是</option><option>否</option><option>待確認</option></select><label>備註</label><textarea name="notes" rows="2"></textarea><button>確認送出報名</button></form>';
   h+='</section>';
 }
 el('content').innerHTML=h+(list.length?'':'<div class="empty">目前沒有開放中的活動。</div>');
}
function registerForm(ev,id){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target).entries());o.eventId=id;if(!confirm('確定以 '+o.classCode+' 班報名？送出後不能自行修改。'))return;run('submitRegistration',[o],r=>{alert('報名成功：'+(r.status==='PRIORITY'?'依序錄取':'進入增額抽籤'));load();});}
function eventForm(ev){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target).entries());for(const k of ['startsAt','endsAt','registrationOpensAt','lotteryDeadline']){const d=o[k+'_date'],t=o[k+'_time'];if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!/^\d{2}:\d{2}$/.test(t)){alert('請填寫完整的「'+k+'」日期與時間');return;}o[k]=d+'T'+t;delete o[k+'_date'];delete o[k+'_time'];}if(!confirm('建立活動並開放報名？'))return;run('createEvent',[o],()=>{alert('活動已建立');load();});}
function draw(id){if(!confirm('抽籤只能執行一次，確認執行？'))return;run('runLottery',[id],r=>{alert('抽籤完成：'+(r.winner.join('、')||'無候選班級'));load();});}
load();
</script></body></html>
