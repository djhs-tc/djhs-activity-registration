<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大甲國中｜活動報名平台</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f7f4ed;color:#173c31}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:30px 20px 65px}h1{font-size:clamp(36px,6vw,60px);margin:10px 0}p{line-height:1.8}.eyebrow{letter-spacing:.17em;font-size:13px;font-weight:700;color:#648276}.lead{color:#526c60}.nav{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0}.nav button{border:1px solid #cbd8ce;border-radius:30px;padding:11px 20px;font-weight:700;cursor:pointer;background:white;color:#19483a}.nav button[aria-selected=true]{background:#19614e;color:white}.card{padding:26px;border:1px solid #e3e3d9;border-radius:20px;background:white;box-shadow:0 7px 22px #142f2310;margin:16px 0}.pill{display:inline-block;background:#e5efe8;border-radius:15px;padding:5px 12px;font-size:13px;font-weight:700}.detail{border-bottom:1px solid #eee;padding:12px 0}.detail strong{display:inline-block;width:86px}.muted{color:#61786e;font-size:14px}.notice{background:#fff0cf;border-radius:12px;padding:13px 17px;color:#6d4d18}.empty{padding:30px;text-align:center}.title{font-size:25px;margin:12px 0}footer{text-align:center;color:#75877c;font-size:13px;margin-top:40px}@media(max-width:560px){main{padding:22px 14px}.card{padding:20px}}</style></head><body><main><div class="eyebrow">DJHS / ACTIVITY HUB</div><h1>讓學習<br>從行動開始。</h1><p class="lead">大甲國中活動報名平台｜講座、學習活動及校內研習集中查看。</p><nav class="nav" aria-label="功能分頁"><button aria-selected="true" id="tab-events" onclick="choose('events')">活動列表</button><button aria-selected="false" id="tab-mine" onclick="choose('mine')">我的報名</button><button aria-selected="false" id="tab-admin" onclick="choose('admin')">管理後台</button></nav><div id="content" aria-live="polite"><div class="card">正在讀取活動資料…</div></div><footer>臺中市立大甲國民中學 · 教務處教學組</footer></main><script>
const box=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let activities=[],loaded=false,error='';
function choose(page){for(const key of ['events','mine','admin'])document.getElementById('tab-'+key).setAttribute('aria-selected',String(key===page));if(page==='events')renderEvents();else box.innerHTML='<section class="card"><h2>'+(page==='admin'?'管理後台':'我的報名')+'</h2><p class="notice">Google OAuth 身分驗證尚未完成，本區暫未開放。請勿提供帳號密碼或個人資料。</p></section>';}
function renderEvents(){if(error){box.innerHTML='<section class="card"><p>活動資料暫時無法載入，請稍後再試。</p><p class="muted">'+esc(error)+'</p></section>';return;}if(!loaded){box.innerHTML='<section class="card">正在讀取活動資料…</section>';return;}if(!activities.length){box.innerHTML='<section class="card empty"><h2>目前尚無開放報名活動</h2><p class="muted">資料直接讀取自 Cloudflare D1。由管理員建立並開放活動後才會出現。</p></section>';return;}box.innerHTML=activities.map(a=>'<section class="card"><span class="pill">開放活動</span><h2 class="title">'+esc(a.title)+'</h2><p>'+esc(a.description)+'</p><div class="detail"><strong>講師</strong>'+esc(a.speaker)+'</div><div class="detail"><strong>日期時間</strong>'+esc(a.starts_at)+' 至 '+esc(a.ends_at)+'</div><div class="detail"><strong>地點</strong>'+esc(a.venue)+'</div><div class="detail"><strong>參加對象</strong>'+esc(a.audience)+'</div><div class="detail"><strong>名額</strong>優先 '+Number(a.priority_quota)+' 班，抽籤 '+Number(a.lottery_quota)+' 班</div><div class="detail"><strong>報名截止</strong>'+esc(a.deadline_at)+'</div><p class="notice">報名功能正在進行 Google 身分驗證整合，暫不接受正式報名。</p></section>').join('');}
fetch('/api/activities',{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(x=>{activities=x.activities||[];loaded=true;if(document.getElementById('tab-events').getAttribute('aria-selected')==='true')renderEvents();}).catch(e=>{error=e.message;if(document.getElementById('tab-events').getAttribute('aria-selected')==='true')renderEvents();});
</script></body></html>
