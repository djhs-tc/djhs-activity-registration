.stat{background:#f3f6f2;border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:24px;color:#173c31}.stat span{font-size:12px;color:#4f6a5e}.dash-item:focus-visible,.dash-link:focus-visible,.nav button:focus-visible,.subnav button:focus-visible,button.btn:focus-visible,.cal-item:focus-visible{outline:3px solid #1f7a55;outline-offset:2px}@media(max-width:1023px){.hero{grid-template-columns:1fr;gap:16px}}@media(max-width:767px){.dash{padding:16px}.dash-list{max-height:200px}.dash-list:has(+h3),.dash-list+h3+.dash-list{max-height:126px}.stat b{font-size:20px}}.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.th-sort{background:none;border:0;padding:0;font:inherit;font-weight:700;color:#61786e;cursor:pointer;white-space:nowrap}.th-sort:focus-visible{outline:3px solid #1f7a55;outline-offset:2px}.admin-table td{white-space:normal}.nowrap{white-space:nowrap}.actcount{margin:14px 4px 6px;color:#526c60}.actgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:36px;background:#fff;border:1px solid #e3e3d9;border-radius:20px;padding:0 28px;box-shadow:0 7px 22px #142f2310}.actgrid.empty-grid{display:none}.actcard{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;padding:24px 0;border-bottom:1px solid #b9c7bd;align-items:start}.actcard.wide{grid-column:1/-1}.tile{aspect-ratio:1/1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}.tile-lecture{background:#1f5c49;color:#fff}.tile-camp{background:#f3e3bf;color:#5b3d0b}.tile-off{background:#e6e6e6;color:#666}.tile-kind{font-size:13px;letter-spacing:.3em;font-weight:700}.tile-date{font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}.tile-wd{font-size:13px}.actdate{font-size:19px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}.actdate small{font-size:13px;font-weight:400}.acttags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 6px}.boxtag{border:1px solid #173c31;padding:2px 8px;font-size:13px}.acttitle{font-size:22px;line-height:1.4;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.actcard.wide .acttitle{display:block}.actinfo{color:#33493f;line-height:1.8;font-size:15px}.actbtn{display:inline-block;background:#173c31;color:#fff!important;border-radius:6px;padding:7px 14px;list-style:none;font-size:14px}.actbtn::-webkit-details-marker{display:none}details[open]>.actbtn{background:#526c60}@media(max-width:900px){.actgrid{grid-template-columns:minmax(0,1fr)}}@media(max-width:560px){.actgrid{padding:0 14px}.actcard{grid-template-columns:84px minmax(0,1fr);gap:12px;padding:18px 0}.tile-date{font-size:22px}.tile-kind{letter-spacing:.1em}.acttitle{font-size:18px}.actdate{font-size:15px}}.calback-row{grid-column:1/-1;margin-bottom:4px}.calback{background:#e3ecfb;border-color:#9db8ec;color:#1d4ed8}.pill.soon{background:#fde3df;color:#a3301f}.pill.kind{background:transparent;border:1px solid #cbd8ce;color:#526c60}.pill.muted-pill{background:#f1f3f2;color:#526c60}.card.compact{padding:20px 24px}.card.compact .title{margin:10px 0 6px}.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:#526c60;font-size:15px}.quota{margin:12px 0 4px;font-size:15px}.quota .left{color:#1f7a55;font-size:18px}.quota .full{color:#a3301f;margin-left:4px}.bar{height:8px;background:#e8ece9;border-radius:6px;overflow:hidden;margin-top:8px;max-width:420px}.bar>i{display:block;height:100%;background:#1f7a55}details.more{margin-top:12px}details.more>summary{cursor:pointer;font-weight:700;color:#19614e;padding:6px 0}.filterbar{margin:4px 0 0}

footer{text-align:center;color:#75877c;font-size:13px;margin-top:40px}@media(max-width:560px){main{padding:22px 14px}.card{padding:20px}form.grid{grid-template-columns:1fr}}</style></head><body><main><div class="eyebrow">DJHS / ACTIVITY HUB</div><div class="hero"><div class="hero-main"><h1>讓學習<br>從行動開始。</h1><p class="lead">大甲國中活動報名平台｜講座、學習活動及校內研習集中查看。</p><div class="authbar" id="authbar" aria-live="polite"></div></div><aside class="dash" id="dashboard" aria-labelledby="dash-title" aria-live="polite"><h2 class="dash-h" id="dash-title">活動快訊</h2><p class="muted">讀取中…</p></aside></div><nav class="nav" aria-label="功能分頁"><button aria-selected="true" id="tab-events" onclick="choose('events')">活動列表</button><button aria-selected="false" id="tab-mine" onclick="choose('mine')">我的報名</button><button aria-selected="false" id="tab-admin" onclick="choose('admin')" hidden>管理後台</button></nav><div id="content" aria-live="polite"><div class="card">正在讀取活動資料…</div></div><footer>臺中市立大甲國民中學 · 教務處教學組 · <a href="/privacy">隱私權說明</a></footer></main><script>
const box=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={priority:['優先錄取',''],lottery_pool:['抽籤候選','warn'],selected:['抽籤錄取',''],not_selected:['未錄取','bad'],cancelled:['已取消','off'],pending:['處理中','warn']};
const ACT={draft:'草稿',open:'開放中',closed:'已關閉',drawn:'已抽籤',archived:'已封存'};
const WD='日一二三四五六';
function fmt(iso){if(!iso)return'';const d=new Date(Date.parse(iso)+8*3600e3);const p=n=>String(n).padStart(2,'0');return d.getUTCFullYear()+'/'+p(d.getUTCMonth()+1)+'/'+p(d.getUTCDate())+'（'+WD[d.getUTCDay()]+'）'+p(d.getUTCHours())+':'+p(d.getUTCMinutes());}
function parts(iso){const d=new Date(Date.parse(iso)+8*3600e3).toISOString();return{date:d.slice(0,10),time:d.slice(11,16)};}
async function api(path,opts={}){const init={cache:'no-store',...opts};if(opts.body!==undefined){init.method=opts.method||'POST';init.headers={'content-type':'application/json'};init.body=JSON.stringify(opts.body);}const r=await fetch(path,init);const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||('HTTP '+r.status));return x;}
let myRegs=[],adminRegs=[],page='events',adminPage='manage',authCfg={authEnabled:false},me=null,authMsg='',activities=[],serverNow='',loaded=false,error='',flash={};
function choose(p){if(p==='admin'&&!(me&&me.isAdmin))p='events';page=p;for(const key of ['events','mine','admin'])document.getElementById('tab-'+key).setAttribute('aria-selected',String(key===p));render();}
// 「管理後台」分頁只對已登入的管理員顯示（實際權限一律由後端檢查）
function syncAdminTab(){const isAdmin=Boolean(me&&me.isAdmin);document.getElementById('tab-admin').hidden=!isAdmin;if(!isAdmin&&page==='admin')choose('events');}
function render(){if(page==='events')return renderEvents();if(page==='mine')return renderMine();return renderAdmin();}
function gate(title){if(!authCfg.authEnabled)return'<section class="card"><h2>'+title+'</h2><p class="notice">Google 身分驗證尚未設定完成，本區暫未開放。</p></section>';if(!me)return'<section class="card"><h2>'+title+'</h2><p>'+(authCfg.openLogin?'請先使用 Google 帳號登入。':'請先使用學校 Google 帳號（@st.tc.edu.tw 或 @tjjh.tc.edu.tw）登入；慣用 Gmail 的老師，請先請教學組將信箱加入名單。')+'</p></section>';return'';}

// ---------- 活動列表與報名 ----------
async function loadActivities(){try{const x=await api('/api/activities');activities=x.activities||[];serverNow=x.now;loaded=true;error='';}catch(e){error=e.message;}if(page==='events')renderEvents();renderDashboard();}
// 狀態：key 用於篩選，cls 決定標籤顏色
function isFull(a){return a.kind==='survey'&&a.overflow_mode==='close'&&Number(a.max_participants)>0&&Number(a.student_count)>=Number(a.max_participants);}
function windowState(a){if(a.cancelled_at)return{key:'closed',label:'活動取消',cls:'cancelled'};if(a.status==='open'&&isFull(a)&&serverNow>=a.opens_at&&serverNow<a.deadline_at)return{key:'closed',label:'額滿',cls:'soon'};if(a.status==='drawn')return{key:'closed',label:'已抽籤',cls:'drawn'};if(a.status==='closed'||serverNow>=a.deadline_at)return{key:'closed',label:'報名已截止',cls:'off'};if(serverNow<a.opens_at)return{key:'upcoming',label:'尚未開放',cls:'upcoming'};return{key:'open',label:'報名中',cls:'open'};}
function daysLeft(iso){return Math.ceil((Date.parse(iso)-Date.parse(serverNow))/864e5);}
function timeRange(a){const s=fmt(a.starts_at),e=fmt(a.ends_at);return s.slice(0,10)===e.slice(0,10)?s+' – '+e.slice(-5):s+' – '+e;}
// 名額摘要：講座顯示已報名／剩餘優先名額與進度條；意願調查顯示班數與男女人數
// 意願調查：班數、男女人數、費用，以及成團人數門檻進度
function capacityLine(a){const cap=Number(a.max_participants),st=Number(a.student_count);if(!cap)return'';if(a.status==='drawn'&&a.overflow_mode==='lottery')return'<div>名額 '+cap+' 人｜<b>抽籤完成</b>：錄取 <b>'+Number(a.selected_students)+'</b> 人，結果請至「我的報名」查看</div>';if(a.overflow_mode==='lottery')return'<div>名額 '+cap+' 人｜'+(st>cap?'已超過名額 <b class="full">'+(st-cap)+'</b> 人，截止後抽籤':'剩 <b class="left">'+(cap-st)+'</b> 人')+'<span class="muted">（超過名額時，截止後以學生為單位抽籤）</span></div>';const left=Math.max(0,cap-st);return'<div>名額 '+cap+' 人｜'+(left?'剩 <b class="left">'+left+'</b> 人':'<b class="full">已額滿</b>')+'<span class="muted">（額滿即截止）</span></div>';}
function surveySummary(a,opt){const st=Number(a.student_count),min=Number(a.min_participants),fee=Number(a.fee);let h='<div class="quota">'+(a.fill_mode==='student'?'已報名 <b>'+st+'</b> 人':'已登記 <b>'+Number(a.registered_count)+'</b> 班，共 <b>'+st+'</b> 人')+'（男 '+Number(a.male_count)+'、女 '+Number(a.female_count)+'）'+(opt&&opt.noFee?'':'｜'+(fee?'材料費 <b>'+fee+'</b> 元':'<b>免費</b>'))+capacityLine(a);if(min>0){const pct=Math.min(100,Math.round(st/min*100));h+='<div>'+(st>=min?'<span class="okmin">✔ 已達成團人數</span>（門檻 '+min+' 人）':'成團門檻 '+min+' 人｜還差 <b class="left">'+(min-st)+'</b> 人')+'</div><div class="bar"><i style="width:'+pct+'%;background:'+(st>=min?'#1f7a55':'#d4a017')+'"></i></div>';}return h+'</div>';}
function quotaSummary(a,opt){const n=Number(a.registered_count);if(a.kind==='survey')return surveySummary(a,opt);
const q=Number(a.priority_quota),lq=Number(a.lottery_quota),pr=Math.min(n,q),pool=Math.max(0,n-q),left=Math.max(0,q-n),pct=q?Math.round(pr/q*100):100;
const ended=a.status==='drawn'||a.status==='closed'||serverNow>=a.deadline_at;
const text=a.status==='drawn'?'已報名 <b>'+n+'</b> 班｜優先錄取 '+pr+' 班'+(pool?'、抽籤錄取 '+Math.min(pool,lq)+' 班':'')+'｜<b>抽籤已完成</b>，結果請至「我的報名」查看'
:ended?'已報名 <b>'+n+'</b> 班｜優先錄取 '+pr+' 班'+(pool?'｜抽籤候選 <b>'+pool+'</b> 班，等待抽出 '+lq+' 班':'')
:left>0?'已報名 <b>'+n+'</b> 班｜優先名額剩 <b class="left">'+left+'</b> 班（共 '+q+' 班）':'優先名額 '+q+' 班<b class="full">已額滿</b>｜抽籤候選 <b>'+pool+'</b> 班，截止後抽出 '+lq+' 班';
return'<div class="quota">'+text+'<div class="bar" title="優先名額 '+pr+'/'+q+'"><i style="width:'+pct+'%"></i></div></div>';}
let eventFilter='all';const openCards=new Set();
function setFilter(k){eventFilter=k;renderEvents();}
function renderEvents(){if(error){box.innerHTML='<section class="card"><p>活動資料暫時無法載入，請稍後再試。</p><p class="muted">'+esc(error)+'</p></section>';return;}if(!loaded){box.innerHTML='<section class="card">正在讀取活動資料…</section>';return;}if(!activities.length){box.innerHTML='<section class="card empty"><h2>目前尚無開放報名活動</h2><p class="muted">由管理員建立並開放活動後才會出現。</p></section>';return;}
const states=new Map(activities.map(a=>[a.id,windowState(a)]));const count=k=>activities.filter(a=>k==='all'||states.get(a.id).key===k).length;
const filters=[['all','全部'],['open','報名中'],['upcoming','尚未開放'],['closed','已截止']].filter(([k])=>k==='all'||count(k));if(!filters.some(([k])=>k===eventFilter))eventFilter='all';
const bar='<nav class="subnav filterbar" aria-label="活動篩選">'+filters.map(([k,l])=>'<button aria-selected="'+(eventFilter===k)+'" onclick="setFilter(\''+k+'\')">'+l+' '+count(k)+'</button>').join('')+'</nav>';
const vbar='<div class="viewbar">'+bar+viewToggle()+'</div>';const order={open:0,upcoming:1,closed:2};const list=activities.filter(a=>eventFilter==='all'||states.get(a.id).key===eventFilter).sort((x,y)=>order[states.get(x.id).key]-order[states.get(y.id).key]||x.deadline_at.localeCompare(y.deadline_at));
if(eventView==='calendar'){box.innerHTML=vbar+calendarView(list);return;}if(eventView==='list'){box.innerHTML=vbar+list.map(a=>listCard(a,states.get(a.id))).join('')+(list.length?'':'<section class="card empty"><p class="muted">此分類目前沒有活動。</p></section>');return;}box.innerHTML=vbar+(list.length?'<p class="actcount">目前共有 <b>'+list.length+'</b> 筆活動</p>':'')+'<div class="actgrid'+(list.length?'':' empty-grid')+'">'+list.map(a=>{const st=states.get(a.id);const {tags,details}=cardParts(a,st);const survey=a.kind==='survey';const fee=survey&&Number(a.fee)?'材料費 '+Number(a.fee)+' 元':'免費';return'<section class="actcard'+(openCards.has(a.id)||a.id===calReturnId?' wide':'')+'" id="act-'+a.id+'">'+(a.id===calReturnId?'<div class="calback-row">'+calBackBtn(a)+'</div>':'')+actTile(a)+'<div class="actbody"><div class="actdate">'+rocRange(a)+'</div><div class="acttags"><span class="boxtag">'+(survey?'營隊意願調查':'講座')+'</span>'+tags+'</div><h2 class="acttitle">'+esc(a.title)+'</h2>'+'<div class="actinfo"><div>活動費用：'+fee+'</div>'+(a.venue?'<div>活動地點：'+esc(a.venue)+'</div>':'')+'<div>報名期間：'+fmt(a.opens_at).slice(5)+' 至 '+fmt(a.deadline_at).slice(5)+'</div></div>'+(a.cancelled_at?'<p class="cancelnote">本活動已取消：'+esc(a.cancel_reason)+'</p>':quotaSummary(a,{noFee:true}))+details+'</div></section>';}).join('')+'</div>'+(list.length?'':'<section class="card empty"><p class="muted">此分類目前沒有活動。</p></section>');}
// 兩種列表共用：狀態標籤、報名區與詳細資訊
function cardParts(a,st){const canReg=st.key==='open';let action='';const f=flash[a.id];if(f){action+='<p class="'+(f.ok?'ok':'notice err')+'">'+esc(f.msg)+'</p>';openCards.add(a.id);}
if(canReg&&isOpenReg(a)){action+=openRegForm(a)+openCancelForm(a);}else if(canReg){if(!authCfg.authEnabled)action+='<p class="notice">報名系統設定中，暫不接受報名。</p>';else if(!me)action+='<p class="notice">'+(authCfg.openLogin?'請先在上方使用 Google 帳號登入後報名。':'請先在上方使用學校 Google 帳號（或已登記的個人 Gmail）登入後報名。')+'</p>';else action+=regForm(a);}else if(st.key==='upcoming')action+='<p class="notice">將於 '+fmt(a.opens_at)+' 開放報名。</p>';
const dl=daysLeft(a.deadline_at);const tags='<span class="pill '+st.cls+'">'+st.label+'</span>'+(canReg&&dl<=3?' <span class="pill soon">'+(dl<=1?'今天截止':'剩 '+dl+' 天截止')+'</span>':'')+(st.key==='upcoming'?' <span class="pill muted-pill">'+(daysLeft(a.opens_at)<=1?'即將開放':daysLeft(a.opens_at)+' 天後開放')+'</span>':'');
const details='<details class="more"'+(openCards.has(a.id)?' open':'')+' ontoggle="this.open?openCards.add(\''+a.id+'\'):openCards.delete(\''+a.id+'\');const c=this.closest(\'.actcard\');if(c)c.classList.toggle(\'wide\',this.open)"><summary class="actbtn">'+(canReg?'詳細資訊與報名':'詳細資訊')+'</summary>'+(a.description?'<p class="desc">'+esc(a.description)+'</p>':'')+'<div class="detail"><strong>講師</strong>'+esc(a.speaker)+'</div><div class="detail"><strong>參加對象</strong>'+esc(a.audience)+'</div>'+(a.organizer_name?'<div class="detail"><strong>承辦人</strong>'+esc(a.organizer_name)+'</div>':'')+(a.kind==='survey'?'<div class="detail"><strong>報名方式</strong>'+(a.fill_mode==='student'?(Number(a.login_required)===0?'學生個人報名（一人一筆，免登入，請填寫 Email 留存）':'學生個人報名（一人一筆，請用自己的帳號登入填寫）'):'由導師以班級登記參加學生名單')+'，每班最多 '+Number(a.max_students_per_class)+' 人</div><div class="detail"><strong>費用</strong>'+(Number(a.fee)?'每人 '+Number(a.fee)+' 元（確認成團後通知繳費）':'免費')+'</div>'+(Number(a.min_participants)?'<div class="detail"><strong>成團條件</strong>全校報名達 '+Number(a.min_participants)+' 人才成團</div>':''):'<div class="detail"><strong>錄取方式</strong>依報名順序優先錄取 '+Number(a.priority_quota)+' 班；其餘於截止後抽籤錄取 '+Number(a.lottery_quota)+' 班</div>')+action+'</details>';
return{tags,details,canReg};}
// 原本的列表：精簡卡片
function listCard(a,st){const {tags,details}=cardParts(a,st);return'<section class="card compact" id="act-'+a.id+'">'+(a.id===calReturnId?'<div class="calback-row">'+calBackBtn(a)+'</div>':'')+tags+' <span class="pill kind">'+(a.kind==='survey'?'營隊意願調查':'講座')+'</span><h2 class="title">'+esc(a.title)+'</h2><div class="meta"><span>📅 '+timeRange(a)+'</span>'+(a.venue?'<span>📍 '+esc(a.venue)+'</span>':'')+'<span>🕒 報名 '+fmt(a.opens_at)+' 至 '+fmt(a.deadline_at)+'</span></div>'+(a.cancelled_at?'<p class="cancelnote">本活動已取消：'+esc(a.cancel_reason)+'</p>':quotaSummary(a))+details+'</section>';}
// ---------- 活動卡片：文字色塊（取代圖片）與民國年日期 ----------
function tpParts(iso){const d=new Date(Date.parse(iso)+8*3600e3);const p=n=>String(n).padStart(2,'0');return{roc:(d.getUTCFullYear()-1911)+'/'+p(d.getUTCMonth()+1)+'/'+p(d.getUTCDate()),md:(d.getUTCMonth()+1)+'/'+d.getUTCDate(),wd:WD[d.getUTCDay()],time:p(d.getUTCHours())+':'+p(d.getUTCMinutes())};}
function rocRange(a){const s=tpParts(a.starts_at),e=tpParts(a.ends_at);return s.roc===e.roc?s.roc+' <small>('+s.wd+')</small> '+s.time+'–'+e.time:s.roc+' <small>('+s.wd+')</small> – '+e.roc+' <small>('+e.wd+')</small>';}
function actTile(a){const s=tpParts(a.starts_at);const cls=a.cancelled_at?'tile-off':a.kind==='survey'?'tile-camp':'tile-lecture';return'<div class="tile '+cls+'" aria-hidden="true"><span class="tile-kind">'+(a.kind==='survey'?'營隊':'講座')+'</span><span class="tile-date">'+s.md+'</span><span class="tile-wd">星期'+s.wd+'</span></div>';}
// ---------- 月曆檢視 ----------
let eventView='cards',calMonth='';
function setView(v){eventView=v;calReturnId='';renderEvents();}
function viewToggle(){return'<nav class="subnav viewtoggle" aria-label="檢視方式"><button aria-selected="'+(eventView==='list')+'" onclick="setView(\'list\')">☰ 列表</button><button aria-selected="'+(eventView==='cards')+'" onclick="setView(\'cards\')">▦ 圖文</button><button aria-selected="'+(eventView==='calendar')+'" onclick="setView(\'calendar\')">📅 月曆</button></nav>';}
function tpDate(iso){return new Date(Date.parse(iso)+8*3600e3).toISOString().slice(0,10);}
function calShift(n){const [y,m]=calMonth.split('-').map(Number);calMonth=new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7);renderEvents();}
function calToday(){calMonth=tpDate(serverNow).slice(0,7);renderEvents();}
let calReturnId='';
function backToCalendar(){calReturnId='';eventView='calendar';renderEvents();const h=document.querySelector('.calhead');if(h)h.scrollIntoView({behavior:'smooth',block:'start'});}
function calBackBtn(a){if(a.id!==calReturnId)return'';const [y,m]=calMonth.split('-').map(Number);return'<button class="btn calback" onclick="backToCalendar()">← 回到月曆（'+y+' 年 '+m+' 月）</button>';}
function openActivity(id){calReturnId=eventView==='calendar'?id:'';if(eventView==='calendar')eventView='cards';eventFilter='all';openCards.add(id);renderEvents();const el=document.getElementById('act-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
// 每個活動在月曆上的標記：活動期間（每天）、開放報名日、報名截止日
function calendarItems(list){const map=new Map();const add=(d,item)=>{if(!map.has(d))map.set(d,[]);map.get(d).push(item);};
for(const a of list){const cancelled=Boolean(a.cancelled_at);let d=tpDate(a.starts_at);const end=tpDate(a.ends_at);for(let i=0;i<62&&d<=end;i++){add(d,{a,type:cancelled?'cancel':'event',label:a.title,sort:2});d=new Date(Date.parse(d+'T00:00:00Z')+864e5).toISOString().slice(0,10);}
if(!cancelled){add(tpDate(a.opens_at),{a,type:'open',label:'開放報名：'+a.title,sort:0});add(tpDate(a.deadline_at),{a,type:'deadline',label:'報名截止：'+a.title,sort:1});}}
for(const v of map.values())v.sort((x,y)=>x.sort-y.sort);return map;}
function calendarView(list){if(!calMonth)calMonth=tpDate(serverNow).slice(0,7);const [y,m]=calMonth.split('-').map(Number);const items=calendarItems(list);const today=tpDate(serverNow);
const first=new Date(Date.UTC(y,m-1,1));const days=new Date(Date.UTC(y,m,0)).getUTCDate();const lead=first.getUTCDay();const p2=n=>String(n).padStart(2,'0');
let cells='';for(let i=0;i<lead;i++)cells+='<div class="calcell blank"></div>';
for(let d=1;d<=days;d++){const key=y+'-'+p2(m)+'-'+p2(d);const its=items.get(key)||[];const shown=its.slice(0,3);
cells+='<div class="calcell'+(key===today?' today':'')+'"><div class="calday">'+d+'</div>'+shown.map(it=>'<button class="cal-item t-'+it.type+'" title="'+esc(it.label)+'" onclick="openActivity(\''+it.a.id+'\')">'+esc(it.label)+'</button>').join('')+(its.length>3?'<div class="muted" style="font-size:11px">另有 '+(its.length-3)+' 項</div>':'')+'</div>';}
const monthKeys=[...items.keys()].filter(k=>k.startsWith(calMonth)).sort();
const agenda=monthKeys.length?'<ul class="agenda">'+monthKeys.map(k=>'<li><b>'+fmt(k+'T00:00:00+08:00').slice(5,13)+'</b>'+items.get(k).map(it=>'<button class="cal-item inline t-'+it.type+'" onclick="openActivity(\''+it.a.id+'\')">'+esc(it.label)+'</button>').join('')+'</li>').join('')+'</ul>':'<p class="muted">本月沒有活動行程。</p>';
return'<section class="card"><div class="calhead"><button class="btn" onclick="calShift(-1)">‹ 上個月</button><h3>'+y+' 年 '+m+' 月</h3><button class="btn" onclick="calShift(1)">下個月 ›</button><button class="btn" onclick="calToday()">本月</button></div>'
+'<div class="legend"><span class="t-open">開放報名</span><span class="t-deadline">報名截止</span><span class="t-event">活動期間</span><span class="t-cancel">已取消</span></div>'
+'<div class="calgrid">'+['日','一','二','三','四','五','六'].map(w=>'<div class="calwd">'+w+'</div>').join('')+cells+'</div>'
+'<h3 style="margin-top:20px">本月行程</h3>'+agenda+'<p class="muted">點選活動可查看詳細資訊與報名。</p></section>';}
// ---------- 首頁活動資訊看板（資料全部來自既有 API；身分由後端判定） ----------
let dashSeq=0;
function scrollToContent(){const n=document.querySelector('nav.nav');if(n)n.scrollIntoView({behavior:'smooth',block:'start'});}
function dashCount(arr){return arr.length?' <span class="dash-count">共 '+arr.length+' 項</span>':'';}
function dashShell(title,body,links){return'<h2 class="dash-h" id="dash-title">'+title+'</h2>'+body+(links?'<div class="dash-links">'+links+'</div>':'');}
function dashLink(label,fn){return'<button class="dash-link" onclick="'+fn+'">'+label+'</button>';}
function dashItem(fn,title,meta,tag){return'<li><button class="dash-item" onclick="'+fn+'"><span class="dash-title">'+esc(title)+'</span>'+(tag||'')+'<span class="dash-meta">'+meta.join('<br>')+'</span></button></li>';}
function dashTag(a){const st=windowState(a);const soon=st.key==='open'&&daysLeft(a.deadline_at)<=3;return' <span class="pill '+(soon?'soon':st.cls)+'">'+(soon?'即將截止':st.label)+'</span>';}
function openNow(){return activities.filter(a=>windowState(a).key==='open').sort((x,y)=>x.deadline_at.localeCompare(y.deadline_at)||x.starts_at.localeCompare(y.starts_at));}
function openingSoon(){return activities.filter(a=>windowState(a).key==='upcoming').sort((x,y)=>x.opens_at.localeCompare(y.opens_at));}
function actMeta(a){return['報名截止 '+fmt(a.deadline_at),'活動 '+timeRange(a)];}
async function renderDashboard(){const el=document.getElementById('dashboard');if(!el)return;const seq=++dashSeq;
if(error){el.innerHTML=dashShell('活動快訊','<p class="err">活動資料暫時無法載入。</p>',dashLink('重試',"loadActivities()"));return;}
if(!loaded){el.innerHTML=dashShell('活動快訊','<p class="muted">讀取中…</p>');return;}
try{const html=me&&me.isAdmin?await adminDash():me?await userDash():anonDash();if(seq===dashSeq)el.innerHTML=html;}
catch(e){if(seq===dashSeq)el.innerHTML=dashShell('活動快訊','<p class="err">'+esc(e.message)+'</p>',dashLink('重試',"renderDashboard()"));}}
// 未登入：最多 3 筆報名中的活動（即將截止優先）；沒有時列出即將開放者
function anonDash(){const open=openNow();let body;
if(open.length)body='<h3 class="dash-sub">報名中'+dashCount(open)+'</h3><ul class="dash-list" tabindex="0" aria-label="可捲動清單">'+open.map(a=>dashItem("openActivity('"+a.id+"')",a.title,actMeta(a),dashTag(a))).join('')+'</ul>';
else{const up=openingSoon();body='<p class="muted">目前沒有開放報名的活動，歡迎稍後再來查看。</p>'+(up.length?'<h3 class="dash-sub">即將開放報名'+dashCount(up)+'</h3><ul class="dash-list" tabindex="0" aria-label="可捲動清單">'+up.map(a=>dashItem("openActivity('"+a.id+"')",a.title,['開放報名 '+fmt(a.opens_at),'活動 '+timeRange(a)],dashTag(a))).join('')+'</ul>':'');}

// 一般使用者：我的近期報名（最多 2 筆，狀態沿用系統名稱）＋尚未報名的開放活動（最多 2 筆）
async function userDash(){const {registrations:rs}=await api('/api/my/registrations');myRegs=rs;
const mine=rs.filter(r=>r.ends_at>serverNow).sort((x,y)=>x.starts_at.localeCompare(y.starts_at)||y.submitted_at.localeCompare(x.submitted_at));
const taken=new Set(rs.filter(r=>r.status!=='cancelled').map(r=>r.activity_id));const avail=openNow().filter(a=>!taken.has(a.id));
let body='<h3 class="dash-sub">我的近期報名'+dashCount(mine)+'</h3>'+(mine.length?'<ul class="dash-list" tabindex="0" aria-label="可捲動清單">'+mine.map(r=>{const [l,c]=label(r);return dashItem("choose('mine');scrollToContent()",r.title+'｜'+r.class_code+' 班',['活動 '+fmt(r.starts_at)],' <span class="pill '+c+'">'+l+'</span>');}).join('')+'</ul>':'<p class="muted">目前沒有進行中的報名。</p>');
body+='<h3 class="dash-sub">可報名活動'+dashCount(avail)+'</h3>'+(avail.length?'<ul class="dash-list" tabindex="0" aria-label="可捲動清單">'+avail.map(a=>dashItem("openActivity('"+a.id+"')",a.title,actMeta(a),dashTag(a))).join('')+'</ul>':'<p class="muted">目前沒有其他開放報名的活動。</p>');

// 管理員：統計＋實際存在的待辦（草稿未開放、已截止待抽籤、7 天內截止）
async function adminDash(){const {activities:all,now:t}=await api('/api/admin/activities');
const live=a=>!a.cancelled_at&&a.status==='open';const accepting=all.filter(a=>live(a)&&a.opens_at<=t&&t<a.deadline_at);const scheduled=all.filter(a=>live(a)&&t<a.opens_at);
const week=Date.parse(t)+7*864e5;const closing=accepting.filter(a=>Date.parse(a.deadline_at)<=week).sort((x,y)=>x.deadline_at.localeCompare(y.deadline_at));

const todo=[...needDraw.map(a=>dashItem("choose('admin');selected='"+a.id+"';goAdmin('draw');scrollToContent()",a.title,['報名已截止 '+fmt(a.deadline_at)],' <span class="pill soon">待抽籤</span>')),
...closing.map(a=>dashItem("choose('admin');selected='"+a.id+"';goAdmin('list');scrollToContent()",a.title,['報名截止 '+fmt(a.deadline_at)],' <span class="pill soon">即將截止</span>')),
...drafts.map(a=>dashItem("choose('admin');goAdmin('manage');scrollToContent()",a.title,['建立於 '+fmt(a.created_at)],' <span class="pill muted-pill">草稿未開放</span>'))];

function regForm(a){if(a.kind==='survey'&&a.fill_mode==='student')return studentRegForm(a);const opt=(arr)=>arr.map(v=>'<option>'+v+'</option>').join('');const nums=Array.from({length:30},(_,i)=>String(i+1).padStart(2,'0'));

// ---------- 免登入自由報名 ----------

async function submitOpen(ev,id){ev.preventDefault();const f=ev.target;const fd=new FormData(f);const code=fd.get('grade')+fd.get('num'),seat=Number(fd.get('seat')),name=String(fd.get('student_name')||'').trim(),gender=fd.get('gender'),email=String(fd.get('email')||'').trim();
if(!confirm('確認以 '+code+' 班 '+seat+' 號「'+name+'」（'+gender+'）報名？\nEmail：'+email))return;const btn=f.querySelector('button[type=submit]');btn.disabled=true;
try{const x=await api('/api/public/registrations',{body:{activity_id:id,class_code:code,seat_no:seat,name,gender,email,notes:fd.get('notes'),website:fd.get('website')}});void x;flash[id]={ok:true,msg:'報名成功！'+code+' 班 '+seat+' 號 '+name+'（'+email+'）。如需取消，請在截止前於「已報名，要取消？」輸入同一個 Email、班級與座號。'};}catch(e){flash[id]={ok:false,msg:'報名失敗：'+e.message};btn.disabled=false;}await loadActivities();}
async function submitOpenCancel(ev,id){ev.preventDefault();const fd=new FormData(ev.target);if(!confirm('確定取消這筆報名？'))return;try{await api('/api/public/registrations/cancel',{body:{activity_id:id,email:fd.get('email'),class_code:fd.get('grade')+fd.get('num'),seat_no:Number(fd.get('seat'))}});flash[id]={ok:true,msg:'已取消報名。'};}catch(e){flash[id]={ok:false,msg:'取消失敗：'+e.message};}await loadActivities();}

function studentRegForm(a){const nums=Array.from({length:30},(_,i)=>String(i+1).padStart(2,'0'));const seats=Array.from({length:60},(_,i)=>i+1);
return'<form class="grid" onsubmit="submitReg(event,\''+a.id+'\')"><label>年級<select name="grade" required><option value="">請選擇</option><option value="7">七年級</option><option value="8">八年級</option><option value="9">九年級</option></select></label><label>班別<select name="num" required><option value="">請選擇</option>'+nums.map(v=>'<option>'+v+'</option>').join('')+'</select></label><label>座號<select name="seat" required><option value="">請選擇</option>'+seats.map(v=>'<option>'+v+'</option>').join('')+'</select></label><label>學生姓名<input name="student_name" maxlength="20" required value="'+esc(me.name)+'"></label><div><strong style="font-size:14px">性別</strong><div class="row" style="margin-top:8px"><label class="radio"><input type="radio" name="gender" value="男" required>男</label><label class="radio"><input type="radio" name="gender" value="女">女</label></div></div><label class="full">備註（選填）<textarea name="notes" maxlength="200"></textarea></label><div class="full row"><button class="btn primary" type="submit">送出報名</button><span class="muted">以 '+esc(me.email)+' 送出；每個帳號只能報名一次，同班同座號不可重複。報名截止前可在「我的報名」自行取消。</span></div></form>';}
// 學生名單：可直接從 Excel 複製「座號、姓名、性別」三欄貼上（Tab、逗號或空白分隔皆可）
function rosterField(a){const cap=Number(a.max_participants),left=Math.max(0,cap-Number(a.student_count));return'<label class="full">參加學生名單（每行一位：座號 姓名 性別，每班最多 '+Number(a.max_students_per_class)+' 人'+(cap&&a.overflow_mode==='close'?'；全校目前剩 '+left+' 個名額':'')+'）<textarea name="roster" rows="8" placeholder="1&#9;王小明&#9;男&#10;2&#9;李小華&#9;女" oninput="previewRoster(this,'+Number(a.max_students_per_class)+')"></textarea></label><div class="full" data-preview><p class="muted">可直接從 Excel 選取「座號、姓名、性別」三欄複製後貼上。</p></div>';}
function parseRoster(text){const students=[],errors=[];String(text||'').split(/\r?\n/).forEach((line,i)=>{const t=line.trim();if(!t)return;const p=t.split(/[\t,，]+|\s+/).filter(Boolean);if(p.length<3){errors.push('第 '+(i+1)+' 行格式不完整：「'+t+'」');return;}const seat=Number(p[0]),gender=p[p.length-1],name=p.slice(1,-1).join(' ');if(!Number.isInteger(seat)||seat<1||seat>60)errors.push('第 '+(i+1)+' 行座號錯誤');else if(!['男','女'].includes(gender))errors.push('第 '+(i+1)+' 行性別請填「男」或「女」');else if(students.some(s=>s.seat_no===seat))errors.push('座號 '+seat+' 重複');else students.push({seat_no:seat,name,gender});});students.sort((x,y)=>x.seat_no-y.seat_no);return{students,errors};}
function previewRoster(el,max){const {students,errors}=parseRoster(el.value);const m=students.filter(s=>s.gender==='男').length;const box2=el.closest('form').querySelector('[data-preview]');
box2.innerHTML=(errors.length?'<p class="err">'+errors.map(esc).join('<br>')+'</p>':'')+(students.length?'<p class="'+(students.length>max?'err':'ok')+'">共 <b>'+students.length+'</b> 人（男 '+m+'、女 '+(students.length-m)+'）'+(students.length>max?'，超過每班上限 '+max+' 人':'')+'</p><div class="scroll"><table><thead><tr><th>座號</th><th>姓名</th><th>性別</th></tr></thead><tbody>'+students.map(s=>'<tr><td>'+s.seat_no+'</td><td>'+esc(s.name)+'</td><td>'+s.gender+'</td></tr>').join('')+'</tbody></table></div>':'');}
async function submitReg(ev,id){ev.preventDefault();const f=ev.target;const fd=new FormData(f);const code=fd.get('grade')+fd.get('num');const a=activities.find(x=>x.id===id)||{};let students;
if(a.kind==='survey'&&a.fill_mode==='student'){const seat=Number(fd.get('seat')),name=String(fd.get('student_name')||'').trim(),gender=fd.get('gender');if(!seat||!name||!gender){alert('請填寫座號、姓名與性別');return;}students=[{seat_no:seat,name,gender}];if(!confirm('確認以 '+code+' 班 '+seat+' 號「'+name+'」（'+gender+'）報名？'))return;}
else if(a.kind==='survey'){const p=parseRoster(fd.get('roster'));if(p.errors.length){alert('學生名單有誤：\n'+p.errors.join('\n'));return;}if(!p.students.length){alert('請填寫參加學生名單');return;}students=p.students;const m=students.filter(s=>s.gender==='男').length;if(!confirm('確認以 '+code+' 班登記 '+students.length+' 人（男 '+m+'、女 '+(students.length-m)+'）？送出後不能新增學生。'))return;}
else if(!confirm('確認以 '+code+' 班報名？送出後無法自行修改。'))return;const btn=f.querySelector('button[type=submit]');btn.disabled=true;
try{const x=await api('/api/registrations',{body:{activity_id:id,class_code:code,teacher_name:fd.get('teacher_name')||(students&&students[0].name)||'',accompany:fd.get('accompany')||'no',notes:fd.get('notes'),students}});const st=a.kind==='survey'?(a.fill_mode==='student'?'已報名':'已登記 '+students.length+' 人'):STATUS[x.registration.status][0];flash[id]={ok:true,msg:code+' 班報名成功：'+st+(x.registration.status==='lottery_pool'?'（截止後抽籤，結果請至「我的報名」查看）':'')};}catch(e){flash[id]={ok:false,msg:'報名失敗：'+e.message};btn.disabled=false;}await loadActivities();}

async function renderMine(){const g=gate('我的報名');if(g){box.innerHTML=g;return;}box.innerHTML='<section class="card"><h2>我的報名</h2><p>讀取中…</p></section>';
try{const {registrations:rs}=await api('/api/my/registrations');myRegs=rs;if(page!=='mine')return;box.innerHTML='<section class="card"><h2>我的報名</h2><p class="muted">已登入：'+esc(me.name)+'（'+esc(me.email)+'）</p>'+(rs.length?rs.map(r=>{const [l,c]=label(r);return'<div class="detail"><span class="pill '+c+'">'+l+'</span> <strong style="width:auto">'+esc(r.class_code)+' 班</strong>｜'+esc(r.title)+'<div class="muted">活動：'+fmt(r.starts_at)+'，'+esc(r.venue)+'｜報名時間 '+fmt(r.submitted_at)+(r.status==='lottery_pool'?'｜將於 '+fmt(r.deadline_at)+' 截止後抽籤':'')+'</div>'+(r.kind==='survey'&&r.status!=='cancelled'?myRoster(r):'')+'</div>';}).join(''):'<p>尚無報名紀錄。</p>')+'</section>';}catch(e){box.innerHTML='<section class="card"><h2>我的報名</h2><p class="err">'+esc(e.message)+'</p></section>';}}
function label(r){if(r.cancelled_at)return['活動已取消：'+esc(r.cancel_reason),'bad'];return r.kind==='survey'&&r.status==='pending'?['已登記','']:(STATUS[r.status]||[r.status,'']);}
function counts(students){const act=students.filter(s=>s.status==='active');const m=act.filter(s=>s.gender==='M').length;return{n:act.length,m,f:act.length-m};}
function myRoster(r){if(r.fill_mode==='student'){const s=r.students[0]||{};const open=new Date().toISOString()<r.deadline_at;const D={selected:' <span class="pill open">錄取</span>',not_selected:' <span class="pill bad">未錄取</span>'};return'<p>'+esc(r.class_code)+' 班 '+(s.seat_no||'')+' 號 '+esc(s.name||'')+'（'+(s.gender==='M'?'男':'女')+'）'+(s.status==='withdrawn'?' <span class="pill off">不參加</span>':'')+(D[s.draw_result]||'')+'</p>'+(open?'<button class="btn danger" onclick="selfCancel(\''+r.id+'\')">取消報名</button> <span class="muted">報名截止（'+fmt(r.deadline_at)+'）前可自行取消，取消後可重新報名。</span>':'<p class="muted">已截止，如需異動請洽承辦人。</p>');}
const open=new Date().toISOString()<r.deadline_at;const c=counts(r.students);const drawn=r.students.some(s=>s.draw_result);const D={selected:'<span class="pill open">錄取</span>',not_selected:'<span class="pill bad">未錄取</span>'};return'<p>參加 <b>'+c.n+'</b> 人（男 '+c.m+'、女 '+c.f+'）'+(open?'<span class="muted">｜截止（'+fmt(r.deadline_at)+'）前可將學生標記為不參加，但不能新增。</span>':'<span class="muted">｜已截止，如需異動請洽教學組。</span>')+'</p><div class="scroll"><table><thead><tr><th>座號</th><th>姓名</th><th>性別</th><th>狀態</th>'+(drawn?'<th>抽籤結果</th>':'')+'<th></th></tr></thead><tbody>'+r.students.map(s=>'<tr><td>'+s.seat_no+'</td><td>'+esc(s.name)+'</td><td>'+(s.gender==='M'?'男':'女')+'</td><td>'+(s.status==='active'?'參加':'<span class="pill off">不參加</span>')+'</td>'+(drawn?'<td>'+(D[s.draw_result]||'—')+'</td>':'')+'<td>'+(open&&s.status==='active'?'<button class="btn danger" onclick="withdrawMine(\''+r.id+'\','+Number(s.id)+')">不參加</button>':'')+'</td></tr>').join('')+'</tbody></table></div>';}
async function selfCancel(rid){if(!confirm('確定取消這筆報名？取消後可在截止前重新報名。'))return;try{await api('/api/registrations/'+rid+'/cancel',{body:{}});}catch(e){alert(e.message);}renderMine();loadActivities();}
async function withdrawMine(rid,sid){const r=myRegs.find(x=>x.id===rid);const s=r&&r.students.find(x=>x.id===sid);const name=s?s.name:'';if(!confirm('確定將「'+name+'」標記為不參加？標記後無法自行恢復，需洽教學組。'))return;try{await api('/api/registrations/'+rid+'/students/'+sid+'/withdraw',{body:{}});}catch(e){alert(e.message);}renderMine();}

// ---------- 管理後台 ----------
const ADMIN_PAGES=[['manage','活動管理'],['create','建立活動'],['list','報名名單'],['draw','抽籤作業'],['allow','帳號名單']];let adminActs=[],selected='',editing=null,adminMsg='';
function adminShell(inner){return'<section class="card"><h2>管理後台</h2><nav class="subnav">'+ADMIN_PAGES.map(([k,l])=>'<button aria-selected="'+(adminPage===k)+'" onclick="goAdmin(\''+k+'\')">'+l+'</button>').join('')+'</nav>'+(adminMsg?'<p class="ok">'+esc(adminMsg)+'</p>':'')+'</section>'+inner;}
function goAdmin(k,keepMsg){adminPage=k;if(!keepMsg)adminMsg='';if(k!=='create')editing=null;renderAdmin();}
async function renderAdmin(){const g=gate('管理後台');if(g){box.innerHTML=g;return;}if(!me.isAdmin){box.innerHTML='<section class="card"><h2>管理後台</h2><p class="notice">此帳號（'+esc(me.email)+'）沒有管理員權限。</p></section>';return;}
try{adminActs=(await api('/api/admin/activities')).activities;}catch(e){box.innerHTML=adminShell('<section class="card err">'+esc(e.message)+'</section>');return;}if(page!=='admin')return;
if(!selected&&adminActs.length)selected=adminActs[0].id;
if(adminPage==='manage')box.innerHTML=adminShell(manageView());else if(adminPage==='create'){box.innerHTML=adminShell(activityForm(editing));toggleKind(document.getElementById('actform'));actFormSnapshot=actFormState();}else if(adminPage==='list')await listView();else if(adminPage==='allow')await allowView();else await drawView();}
let adminView='cards',adminSort={key:'starts_at',dir:1},adminQuery='';
function setAdminView(v){adminView=v;renderAdmin();}
function setAdminSort(k){adminSort=adminSort.key===k?{key:k,dir:-adminSort.dir}:{key:k,dir:1};renderAdmin();}
function setAdminQuery(v){adminQuery=v;const el=document.getElementById('adminTable');if(el)el.outerHTML=manageTableBody();}
function adminState(a,t){if(a.cancelled_at)return['已取消','cancelled'];if(a.status==='draft')return['草稿','muted-pill'];if(a.status==='archived')return['已封存','off'];if(a.status==='drawn')return['已抽籤','drawn'];if(a.status==='open'&&t<a.opens_at)return['尚未開放','upcoming'];if(a.status==='open'&&t<a.deadline_at)return['報名中','open'];return['已截止','off'];}
function adminCount(a){if(a.kind==='survey')return a.fill_mode==='student'?Number(a.student_count):Number(a.registered_count)*1000+Number(a.student_count);return Number(a.priority_count)+Number(a.pool_count)+Number(a.selected_count)+Number(a.not_selected_count);}
function manageView(){const toggle='<nav class="subnav" aria-label="檢視方式"><button aria-selected="'+(adminView==='cards')+'" onclick="setAdminView(\'cards\')">卡片</button><button aria-selected="'+(adminView==='table')+'" onclick="setAdminView(\'table\')">表格</button></nav>';
return(adminActs.length?'<section class="card" style="padding:12px 18px">'+toggle+'</section>':'')+(adminView==='table'&&adminActs.length?manageTable():manageCards());}
function manageTable(){return'<section class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><input type="search" placeholder="搜尋活動名稱或承辦人" value="'+esc(adminQuery)+'" oninput="setAdminQuery(this.value)" style="min-width:220px" aria-label="搜尋活動"><span class="muted">點欄位標題可排序；狀態變更請切換到「卡片」使用按鈕。</span></div>'+manageTableBody()+'</section>';}
function manageTableBody(){const t=new Date().toISOString();const q=adminQuery.trim().toLowerCase();
const rows=adminActs.filter(a=>!q||(a.title+' '+(a.organizer_name||'')).toLowerCase().includes(q));
const val={title:a=>a.title,state:a=>adminState(a,t)[0],opens_at:a=>a.opens_at,deadline_at:a=>a.deadline_at,starts_at:a=>a.starts_at,count:a=>adminCount(a),organizer:a=>a.organizer_name||''};
const k=val[adminSort.key]||val.starts_at;rows.sort((x,y)=>{const A=k(x),B=k(y);return(typeof A==='string'&&adminSort.key!=='opens_at'&&adminSort.key!=='starts_at'?A.localeCompare(B,'zh-Hant-TW-u-co-stroke'):A<B?-1:A>B?1:0)*adminSort.dir;});
const th=(key,label)=>'<th><button class="th-sort" onclick="setAdminSort(\''+key+'\')">'+label+(adminSort.key===key?(adminSort.dir>0?' ▲':' ▼'):'')+'</button></th>';
const d=iso=>fmt(iso).slice(0,10);
const body=rows.map(a=>{const [sl,sc]=adminState(a,t);const survey=a.kind==='survey';
const count=survey?(a.fill_mode==='student'?Number(a.student_count)+' 人':Number(a.registered_count)+' 班／'+Number(a.student_count)+' 人'):(Number(a.priority_count)+Number(a.pool_count)+Number(a.selected_count)+Number(a.not_selected_count))+' 班';
const prog=survey?(Number(a.min_participants)?Number(a.student_count)+'/'+Number(a.min_participants)+(Number(a.student_count)>=Number(a.min_participants)?' ✔':''):'—'):Math.min(Number(a.priority_count)+Number(a.selected_count),Number(a.priority_quota))+'/'+Number(a.priority_quota);
const canEdit=!a.cancelled_at&&['draft','open','closed'].includes(a.status)&&!a.lottery_at;
return'<tr><td><b>'+esc(a.title)+'</b><div class="muted">'+(survey?'營隊':'講座')+'</div></td><td><span class="pill '+sc+'">'+sl+'</span></td><td>'+d(a.opens_at)+'<br>至 '+d(a.deadline_at)+'</td><td>'+d(a.starts_at)+(d(a.ends_at)!==d(a.starts_at)?'<br>至 '+d(a.ends_at):'')+'</td><td>'+count+'</td><td>'+prog+'</td><td>'+esc(a.organizer_name||'—')+'</td><td class="nowrap">'+(canEdit?'<button class="btn" onclick="editAct(\''+a.id+'\')">編輯</button> ':'')+'<button class="btn" onclick="selected=\''+a.id+'\';goAdmin(\'list\')">名單</button></td></tr>';}).join('');
return'<div class="scroll" id="adminTable"><table class="admin-table"><thead><tr>'+th('title','活動')+th('state','狀態')+th('opens_at','報名期間')+th('starts_at','活動日期')+th('count','報名數')+'<th>成團／名額</th>'+th('organizer','承辦人')+'<th></th></tr></thead><tbody>'+(body||'<tr><td colspan="8" class="muted">沒有符合的活動</td></tr>')+'</tbody></table></div>';}
function manageCards(){if(!adminActs.length)return'<section class="card empty"><p>尚未建立任何活動。</p><button class="btn primary" onclick="goAdmin(\'create\')">建立活動</button></section>';
return adminActs.map(a=>{const b=(label,fn,cls='')=>'<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>';const acts=[];
if(!a.cancelled_at&&['draft','open','closed'].includes(a.status)&&!a.lottery_at)acts.push(b('編輯',"editAct('"+a.id+"')"));if(a.status==='draft')acts.push(b('開放報名',"setStatus('"+a.id+"','open','開放後教師即可在報名期間內報名。確定開放？')",'primary'),b('封存',"setStatus('"+a.id+"','archived','確定封存？')",'danger'));
if(a.status==='open')acts.push(b('關閉報名',"setStatus('"+a.id+"','closed','關閉後教師無法報名。確定？')",'danger'));if(a.status==='closed'&&!a.cancelled_at)acts.push(b('重新開放',"setStatus('"+a.id+"','open','確定重新開放？')"),b('封存',"setStatus('"+a.id+"','archived','確定封存？')",'danger'));if(a.status==='drawn')acts.push(b('封存',"setStatus('"+a.id+"','archived','確定封存？')",'danger'));

// 行事曆提醒：Google 日曆（預先邀請承辦人）＋ .ics 下載
function gcalStamp(iso){return iso.replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
function calEvents(a){const plus=(iso,m)=>new Date(Date.parse(iso)+m*60e3).toISOString();const after=a.kind==='survey'?'截止後請至管理後台「報名名單」統計人數、確認名單並辦理收費。':'截止後請至管理後台「抽籤作業」執行抽籤，並通知錄取班級。';
return[['開放報名','【開放報名】'+a.title,a.opens_at,plus(a.opens_at,30),'活動今日開放報名，請確認報名頁面運作正常並通知導師。'],['報名截止','【報名截止】'+a.title,a.deadline_at,plus(a.deadline_at,30),after],['活動當天',a.title,a.starts_at,a.ends_at,(a.speaker?'講師：'+a.speaker:'')]];}
function calendarRow(a){if(['archived'].includes(a.status))return'';if(!a.organizer_email)return'<p class="notice">尚未指定承辦人，請按「編輯」補上承辦人姓名與信箱，才能建立行事曆提醒。</p>';
const links=calEvents(a).map(([label,title,s,e,details])=>{const q=new URLSearchParams({action:'TEMPLATE',text:title,dates:gcalStamp(s)+'/'+gcalStamp(e),details:details+'\n'+location.origin+'/',location:label==='活動當天'?(a.venue||''):'',add:a.organizer_email});return'<a class="btn" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?'+esc(q.toString())+'">'+label+'</a>';}).join('');
return'<details class="detail" style="border:0"><summary><strong style="width:auto">承辦人</strong> '+esc(a.organizer_name)+'（'+esc(a.organizer_email)+'）<span class="muted">｜行事曆提醒（以下兩種方式擇一）</span></summary>'
+'<p style="margin:10px 0 4px"><b>方式一：Google 日曆</b> <span class="muted">— 一次只能加入一個時間點，需要哪個按哪個（建議至少加「報名截止」）。在 Google 日曆按「儲存」並選「傳送」，承辦人會收到邀請信。</span></p><div class="row">'+links+'</div>'
+'<p style="margin:14px 0 4px"><b>方式二：一次下載全部</b> <span class="muted">— 三個時間點在同一個檔案，內建前 1 天與前 1 小時提醒，適用 Outlook、iPhone 行事曆。</span></p><div class="row"><a class="btn" href="/api/admin/activities/'+a.id+'/calendar.ics">下載 .ics（3 個時間點）</a></div>'
+'<p class="muted">修改活動時間後，請刪除舊的日曆事件並重新加入。</p></details>';}
function activityForm(a){const v=k=>esc(a?a[k]:'');const dt=(k,label)=>{const p=a?parts(a[k+'_at']):{date:'',time:''};return'<label>'+label+'日期<input type="date" name="'+k+'_date" required value="'+p.date+'"></label><label>'+label+'時間<input type="time" name="'+k+'_time" required value="'+p.time+'"></label>';};

(a.min_participants):0)+'"></label><label data-k="survey">填寫方式<select name="fill_mode">'+(()=>{const cur=!a||a.fill_mode!=='student'?'teacher':Number(a.login_required)===0?'open':'student';return[['teacher','導師填寫（以班為單位貼上全班參加名單）'],['student','學生填寫・需登入（學生用自己的 Google 帳號，一人一筆）'],['open','學生填寫・免登入（自填 Email 留存，不驗證）']].map(([v,l])=>'<option value="'+v+'"'+(v===cur?' selected':'')+'>'+l+'</option>').join('');})()+'</select></label><label data-k="survey">人數上限（全校合計，0 = 不限）<input type="number" name="max_participants" min="0" max="2000" value="'+(a?Number(a.max_participants):0)+'"></label><label data-k="survey">額滿處理<select name="overflow_mode"><option value="close"'+(a&&a.overflow_mode==='lottery'?'':' selected')+'>額滿即截止（先到先得）</option><option value="lottery"'+(a&&a.overflow_mode==='lottery'?' selected':'')+'>超過名額改抽籤（截止後以學生為單位抽籤）</option></select></label><label data-k="survey">每班人數上限<input type="number" name="max_students_per_class" min="1" max="60" value="'+(a&&a.max_students_per_class?a.max_students_per_class:35)+'"></label><div class="full row"><button class="btn primary" type="submit">'+(a?'儲存修改':'建立草稿')+'</button><button class="btn" type="button" onclick="cancelActForm()">取消</button><span class="err" id="formerr"></span></div></form></section>';}
function presetDefault(){const f=document.getElementById('actform');const set=(k,v)=>f.elements[k].value=v;set('kind','lecture');toggleKind(f);set('title','自律學習力');set('speaker','陳怡嘉老師（嘉嘉老師）');set('venue','鎮瀾文化大樓');set('audience','七、八、九年級，以班級為單位');set('starts_date','2026-11-12');set('starts_time','14:00');set('ends_date','2026-11-12');set('ends_time','16:00');set('opens_date','2026-10-16');set('opens_time','08:00');set('deadline_date','2026-11-06');set('deadline_time','12:00');set('priority_quota',15);set('lottery_quota',3);}

'<div class="scroll"><table><thead><tr><th>座號</th><th>姓名</th><th>性別</th><th>狀態</th>'+(drawn?'<th>抽籤</th>':'')+(fee?'<th>繳費</th>':'')+'<th></th></tr></thead><tbody>'+r.students.map(s=>'<tr><td>'+s.seat_no+'</td><td>'+esc(s.name)+'</td><td>'+(s.gender==='M'?'男':'女')+'</td><td>'+(s.status==='active'?'參加':'<span class="pill off">不參加</span>')+'</td>'+(drawn?'<td>'+(s.draw_result==='selected'?'<span class="pill open">錄取</span>':s.draw_result==='not_selected'?'<span class="pill bad">未錄取</span>':'—')+'</td>':'')+(fee?'<td><label class="radio"><input type="checkbox"'+(s.paid?' checked':'')+(cancelled?' disabled':'')+' onchange="adminPaid(\''+r.id+'\','+Number(s.id)+',this)">已繳</label></td>':'')+'<td>'+(cancelled?'':s.status==='active'?'<button class="btn danger" onclick="adminStudent(\''+r.id+'\','+Number(s.id)+',\'withdraw\')">不參加</button>':'<button class="btn" onclick="adminStudent(\''+r.id+'\','+Number(s.id)+',\'restore\')">恢復參加</button>')+'</td></tr>').join('')+'</tbody></table></div>'+(cancelled?'':'<div class="row"><button class="btn danger" onclick="cancelReg(\''+r.id+'\',\''+esc(r.class_code)+'\')">取消整班報名</button></div>')+'</details>';}).join('');

function studentClasses(rs,drawn,fee){const groups=new Map();for(const r of rs){if(!groups.has(r.class_code))groups.set(r.class_code,[]);for(const s of r.students)groups.get(r.class_code).push({r,s});}
return[...groups.keys()].sort().map(code=>{const rows=groups.get(code).sort((x,y)=>x.s.seat_no-y.s.seat_no||x.r.submitted_at.localeCompare(y.r.submitted_at));const act=rows.filter(o=>o.r.status!=='cancelled'&&o.s.status==='active');const m=act.filter(o=>o.s.gender==='M').length;const key='c'+code;
return'<details'+(openClasses.has(key)?' open':'')+' ontoggle="this.open?openClasses.add(\''+key+'\'):openClasses.delete(\''+key+'\')" class="detail"><summary><b>'+esc(code)+' 班</b>｜報名 '+act.length+' 人（男 '+m+'、女 '+(act.length-m)+'）</summary>'
+'<div class="scroll"><table><thead><tr><th>座號</th><th>姓名</th><th>性別</th><th>狀態</th>'+(drawn?'<th>抽籤</th>':'')+(fee?'<th>繳費</th>':'')+'<th>填寫人</th><th>報名時間</th><th></th></tr></thead><tbody>'
+rows.map(({r,s})=>{const cancelled=r.status==='cancelled';return'<tr><td>'+s.seat_no+'</td><td>'+esc(s.name)+'</td><td>'+(s.gender==='M'?'男':'女')+'</td><td>'+(cancelled?'<span class="pill off">已取消</span>':s.status==='active'?'參加':'<span class="pill off">不參加</span>')+'</td>'+(drawn?'<td>'+(s.draw_result==='selected'?'<span class="pill open">錄取</span>':s.draw_result==='not_selected'?'<span class="pill bad">未錄取</span>':'—')+'</td>':'')+(fee?'<td><label class="radio"><input type="checkbox"'+(s.paid?' checked':'')+(cancelled?' disabled':'')+' onchange="adminPaid(\''+r.id+'\','+Number(s.id)+',this)">已繳</label></td>':'')+'<td class="muted">'+esc(r.teacher_email)+(r.verified===0?' <span class="pill warn">信箱未驗證</span>':personalTag(r.teacher_email))+'</td><td class="muted">'+fmt(r.submitted_at)+'</td><td>'+(cancelled?'':'<button class="btn danger" onclick="cancelReg(\''+r.id+'\',\''+esc(code)+' 班 '+Number(s.seat_no)+' 號\')">取消報名</button>')+'</td></tr>';}).join('')+'</tbody></table></div></details>';}).join('');}
async function adminStudent(rid,sid,action){const r=adminRegs.find(x=>x.id===rid);const s=r&&r.students.find(x=>x.id===sid);if(!s)return;if(!confirm((action==='withdraw'?'將':'恢復')+' '+r.class_code+' 班 '+s.seat_no+' 號「'+s.name+'」'+(action==='withdraw'?'標記為不參加':'為參加')+'？'))return;const path=action==='withdraw'?'/api/registrations/'+rid+'/students/'+sid+'/withdraw':'/api/admin/registrations/'+rid+'/students/'+sid+'/restore';try{await api(path,{body:{}});}catch(e){alert(e.message);}renderAdmin();}
async function adminPaid(rid,sid,el){el.disabled=true;try{await api('/api/admin/registrations/'+rid+'/students/'+sid+'/paid',{body:{paid:el.checked}});}catch(e){alert(e.message);el.checked=!el.checked;}renderAdmin();}
let allowList=[];
// 用個人帳號（非學校網域）送出的報名，在管理名單中標示，方便辨識與清理
function personalTag(email){const d=String(email||'').split('@')[1]||'';return (authCfg.schoolDomains||[]).includes(d)?'':' <span class="pill warn">個人帳號</span>';}
async function savePolicy(v){const msg=v==='any_google'?'開放所有 Google 帳號登入與報名？\n任何人都能用個人帳號報名，請定期檢查標示「個人帳號」的報名。':'改回只限學校帳號（加上帳號名單）？\n目前用個人帳號登入的人會立即被登出；已送出的報名資料會保留。';if(!confirm(msg)){renderAdmin();return;}try{await api('/api/admin/settings',{body:{login_policy:v}});authCfg=await api('/api/config');adminMsg='登入政策已更新。';}catch(e){alert(e.message);}renderAdmin();}
async function allowView(){const [x,st]=await Promise.all([api('/api/admin/allowed-emails'),api('/api/admin/settings')]);if(page!=='admin'||adminPage!=='allow')return;allowList=x.emails;const pol=st.settings.login_policy;
const policyCard='<section class="card"><h3>誰可以登入報名</h3><label class="radio"><input type="radio" name="pol" value="school_only"'+(pol==='school_only'?' checked':'')+' onchange="savePolicy(this.value)"> 只限學校帳號（'+x.schoolDomains.map(d=>'@'+esc(d)).join('、')+'）＋下方帳號名單</label><br><label class="radio"><input type="radio" name="pol" value="any_google"'+(pol==='any_google'?' checked':'')+' onchange="savePolicy(this.value)"> 所有 Google 帳號（任何人都能登入報名）</label><p class="muted">'+(pol==='any_google'?'目前開放所有 Google 帳號。用個人帳號送出的報名會在名單中標示「個人帳號」；如被濫用，可切回「只限學校帳號」，個人帳號會立即失效。':'目前只限學校帳號與下方名單。')+(st.settings.updated_by?'｜最後由 '+esc(st.settings.updated_by)+' 於 '+fmt(st.settings.updated_at)+' 修改':'')+'</p></section>';
box.innerHTML=adminShell(policyCard+'<section class="card"><h3>帳號名單</h3><p class="muted">學校帳號（'+x.schoolDomains.map(d=>'@'+esc(d)).join('、')+'）不需加入即可登入。慣用 Gmail 等個人信箱的老師，加入名單後才能登入；移除後立即失效。該信箱必須是 Google 帳號（Hotmail 信箱需先註冊成 Google 帳號）。</p><form class="grid" onsubmit="addAllow(event)"><label>信箱<input name="email" type="email" maxlength="100" required placeholder="teacher@gmail.com"></label><label>備註（老師姓名／班級）<input name="note" maxlength="50" required placeholder="王小明老師 701"></label><div class="full row"><button class="btn primary" type="submit">加入名單</button><span class="err" id="allowerr"></span></div></form></section><section class="card"><h3>批次加入</h3><p class="muted">每行一位：信箱、備註。可直接從 Excel 選取「信箱、備註」兩欄複製貼上（Tab 或逗號分隔）。任何一行有誤時整批都不會加入；已在名單中的信箱會自動略過。一次最多 300 筆。</p><form onsubmit="batchAllow(event)"><textarea name="lines" rows="8" style="width:100%" placeholder="wang@gmail.com&#9;王小明老師 701&#10;lee@gmail.com&#9;李小華老師 802" oninput="previewAllow(this)"></textarea><div id="allowpreview" class="muted"></div><div class="row" style="margin-top:10px"><button class="btn primary" type="submit">批次加入</button></div></form><pre id="batchresult" style="white-space:pre-wrap"></pre></section><section class="card"><h3>已加入 '+allowList.length+' 個信箱</h3>'+(allowList.length?'<div class="scroll"><table><thead><tr><th>信箱</th><th>備註</th><th>加入者</th><th>加入時間</th><th></th></tr></thead><tbody>'+allowList.map((e,i)=>'<tr><td>'+esc(e.email)+'</td><td>'+esc(e.note)+'</td><td class="muted">'+esc(e.added_by)+'</td><td class="muted">'+fmt(e.added_at)+'</td><td><button class="btn danger" onclick="removeAllow('+i+')">移除</button></td></tr>').join('')+'</tbody></table></div>':'<p class="muted">尚未加入任何信箱。</p>')+'</section>');}
async function addAllow(ev){ev.preventDefault();const fd=new FormData(ev.target);try{await api('/api/admin/allowed-emails',{body:{email:fd.get('email'),note:fd.get('note')}});adminMsg='已加入 '+String(fd.get('email')).trim().toLowerCase()+'。';renderAdmin();}catch(e){document.getElementById('allowerr').textContent=e.message;}}
// 每行：信箱 + 備註（Tab／逗號分隔；備註可含空白）。信箱欄取含 @ 的那一格。
function parseAllow(text){const entries=[],errors=[];String(text||'').split(/\r?\n/).forEach((line,i)=>{const t=line.trim();if(!t)return;const cells=t.split(/\t|,|，/).map(s=>s.trim()).filter(Boolean);let idx=cells.findIndex(c=>c.includes('@'));let email,note;if(idx<0||cells.length===1){const sp=t.split(/\s+/);idx=sp.findIndex(c=>c.includes('@'));if(idx<0){errors.push('第 '+(i+1)+' 行找不到信箱');return;}email=sp[idx];note=sp.filter((_,j)=>j!==idx).join(' ');}else{email=cells[idx];note=cells.filter((_,j)=>j!==idx).join(' ');}if(!note)errors.push('第 '+(i+1)+' 行缺少備註（'+email+'）');entries.push({email:email.toLowerCase(),note});});return{entries,errors};}
function previewAllow(el){const {entries,errors}=parseAllow(el.value);const p=document.getElementById('allowpreview');p.innerHTML=entries.length||errors.length?'共 '+entries.length+' 筆'+(errors.length?'<div class="err">'+errors.map(esc).join('<br>')+'</div>':''):'';}
async function batchAllow(ev){ev.preventDefault();const {entries,errors}=parseAllow(ev.target.elements.lines.value);const out=document.getElementById('batchresult');if(errors.length){out.textContent='請先修正：\n'+errors.join('\n');out.className='err';return;}if(!entries.length){out.textContent='請貼上至少一筆';out.className='err';return;}if(!confirm('批次加入 '+entries.length+' 筆信箱？'))return;
try{const r=(await api('/api/admin/allowed-emails/batch',{body:{entries}})).result;adminMsg='批次加入完成：新增 '+r.added.length+' 筆'+(r.skipped_existing.length?'，已在名單中略過 '+r.skipped_existing.length+' 筆':'')+(r.skipped_duplicates?'，重複略過 '+r.skipped_duplicates+' 筆':'')+'。';renderAdmin();}catch(e){out.textContent=e.message;out.className='err';}}
async function removeAllow(i){const e=allowList[i];if(!e||!confirm('從名單移除 '+e.email+'（'+e.note+'）？移除後此帳號立即無法登入，但已送出的報名資料會保留。'))return;try{await api('/api/admin/allowed-emails/remove',{body:{email:e.email}});adminMsg='已移除 '+e.email+'。';}catch(err){alert(err.message);}renderAdmin();}
async function cancelReg(rid,code){const reason=prompt('取消 '+code+' 班的報名（抽籤前取消時，最早的抽籤候選班級會自動遞補）。請輸入原因，會記錄在稽核紀錄：');if(reason===null)return;try{await api('/api/admin/activities/'+selected+'/registrations/'+rid+'/cancel',{body:{reason}});adminMsg=code+' 班報名已取消。';}catch(e){alert(e.message);}renderAdmin();loadActivities();}
async function drawView(){if(!adminActs.length){box.innerHTML=adminShell('<section class="card">尚未建立任何活動。</section>');return;}const x=await api('/api/admin/activities/'+selected+'/registrations');if(page!=='admin'||adminPage!=='draw')return;const a=x.activity,rs=x.registrations;const pool=rs.filter(r=>r.status==='lottery_pool');const now=new Date().toISOString();let body;
if(a.kind==='survey'&&!(a.overflow_mode==='lottery'&&Number(a.max_participants)>0)){body='<p class="notice">'+(a.overflow_mode==='lottery'?'已選擇「超過名額改抽籤」，但人數上限為 0（不限），不會超額，所以不需要抽籤。若要抽籤，請到「活動管理 → 編輯」填寫人數上限。':'這個營隊的額滿處理為「額滿即截止」，不需要抽籤。')+'請到「報名名單」查看人數統計與學生名單。</p>';}
else if(a.kind==='survey'){const cap=Number(a.max_participants);const live=rs.filter(r=>r.status!=='cancelled');const act=[];for(const r of live)for(const s of r.students)if(s.status==='active')act.push({r,s});if(x.lottery){const sel=act.filter(o=>o.s.draw_result==='selected');body='<p class="ok">已於 '+fmt(x.lottery.at)+' 由 '+esc(x.lottery.by)+' 完成抽籤（以學生為單位）。候選 '+x.lottery.pool.length+' 人，錄取 '+sel.length+' 人。</p><p class="muted">演算法：'+esc(x.lottery.algorithm)+'</p><p class="muted">隨機種子（可供重算驗證）：<code>'+esc(x.lottery.seed)+'</code></p><div class="scroll"><table><thead><tr><th>抽籤序</th><th>班級</th><th>座號</th><th>姓名</th><th>結果</th></tr></thead><tbody>'+act.filter(o=>o.s.draw_rank).sort((p,q)=>p.s.draw_rank-q.s.draw_rank).map(o=>'<tr><td>'+o.s.draw_rank+'</td><td>'+esc(o.r.class_code)+'</td><td>'+o.s.seat_no+'</td><td>'+esc(o.s.name)+'</td><td>'+(o.s.draw_result==='selected'?'錄取':'未錄取')+'</td></tr>').join('')+'</tbody></table></div>';}else{const ready=now>=a.deadline_at&&['open','closed'].includes(a.status)&&!a.cancelled_at;body='<p>報名截止：'+fmt(a.deadline_at)+'｜名額 '+cap+' 人｜目前有效報名 <b>'+act.length+'</b> 人'+(act.length>cap?'，需抽出 '+cap+' 人':'，未超過名額，抽籤後全部錄取')+'</p>'+(ready?'<p class="notice">抽籤以學生為單位，只能執行一次，結果會立即寫入並無法重抽。</p><button class="btn primary" onclick="doDrawSurvey(\''+a.id+'\','+act.length+','+cap+')">執行抽籤</button>':'<p class="notice">'+(a.status==='draft'?'活動尚未開放。':'報名截止後才能抽籤。')+'</p>');}}
else if(x.lottery){const L=x.lottery;body='<p class="ok">已於 '+fmt(L.at)+' 由 '+esc(L.by)+' 完成抽籤。候選 '+L.pool.length+' 班，抽出 '+L.selected.length+' 班：<b>'+L.selected.map(esc).join('、')+'</b></p><p class="muted">演算法：'+esc(L.algorithm)+'</p><p class="muted">隨機種子（可供重算驗證）：<code>'+esc(L.seed)+'</code></p><div class="scroll"><table><thead><tr><th>抽籤序</th><th>班級</th><th>結果</th></tr></thead><tbody>'+L.pool.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p.class_code)+'</td><td>'+(L.selected.includes(p.class_code)?'錄取':'未錄取')+'</td></tr>').join('')+'</tbody></table></div>';}
else{const ready=now>=a.deadline_at&&['open','closed'].includes(a.status);body='<p>報名截止：'+fmt(a.deadline_at)+'｜增額名額 '+a.lottery_quota+' 班｜目前抽籤候選 <b>'+pool.length+'</b> 班'+(pool.length?'：'+pool.map(r=>esc(r.class_code)).join('、'):'')+'</p>'+(ready?'<p class="notice">抽籤只能執行一次，結果會立即寫入並無法重抽。</p><button class="btn primary" onclick="doDraw(\''+a.id+'\','+pool.length+','+a.lottery_quota+')">執行抽籤</button>':'<p class="notice">'+(a.status==='draft'?'活動尚未開放。':'報名截止後才能抽籤。')+'</p>');}
box.innerHTML=adminShell('<section class="card">'+picker()+'<h3>'+esc(a.title)+'</h3>'+body+'</section>');}
async function doDrawSurvey(id,n,q){if(!confirm('將從 '+n+' 位學生中抽出 '+Math.min(n,q)+' 人。抽籤只能執行一次，確定執行？'))return;try{const r=(await api('/api/admin/activities/'+id+'/draw',{body:{}})).result;adminMsg='抽籤完成：候選 '+r.pool_size+' 人，錄取 '+r.selected_count+' 人。';}catch(e){alert(e.message);}renderAdmin();loadActivities();}
async function doDraw(id,n,q){if(!confirm('將從 '+n+' 班候選中抽出最多 '+q+' 班。抽籤只能執行一次，確定執行？'))return;try{const r=(await api('/api/admin/activities/'+id+'/draw',{body:{}})).result;adminMsg='抽籤完成：'+(r.selected.length?r.selected.join('、'):'無候選班級');}catch(e){alert(e.message);}renderAdmin();loadActivities();}

// ---------- 登入 ----------
function renderAuth(){syncAdminTab();renderDashboard();const bar=document.getElementById('authbar');if(!authCfg.authEnabled){bar.innerHTML='';return;}if(me){bar.innerHTML='<span class="muted">已登入：'+esc(me.email)+(me.isAdmin?'（管理員）':'')+'</span><button class="link" onclick="logout()">登出</button>';return;}bar.innerHTML='<div id="gsi"></div>'+(authMsg?'<span class="err">'+esc(authMsg)+'</span>':'');startGoogle();}
let gsiLoading=null;function loadGsi(){return gsiLoading||(gsiLoading=new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=ok;s.onerror=()=>fail(Error('無法載入 Google 登入元件'));document.head.appendChild(s);}));}
async function startGoogle(){try{await loadGsi();const {nonce}=await api('/api/auth/nonce');google.accounts.id.initialize({client_id:authCfg.googleClientId,nonce,callback:onCredential,auto_select:false,context:'signin'});const el=document.getElementById('gsi');if(el)google.accounts.id.renderButton(el,{theme:'outline',size:'large',text:'signin_with',locale:'zh-TW'});}catch(e){authMsg=e.message;document.getElementById('authbar').innerHTML='<span class="err">'+esc(authMsg)+'</span>';}}
async function onCredential(resp){authMsg='';try{me=(await api('/api/auth/google',{body:{credential:resp.credential}})).user;}catch(e){authMsg=e.message;}renderAuth();render();}
async function logout(){await api('/api/auth/logout',{body:{}}).catch(()=>{});me=null;if(window.google)google.accounts.id.disableAutoSelect();renderAuth();render();}

loadActivities();
Promise.all([api('/api/config'),api('/api/me')]).then(([c,m])=>{authCfg=c;me=m.user;renderAuth();render();}).catch(()=>{});
