<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大甲國中｜活動報名平台</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f7f4ed;color:#173c31}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:30px 20px 65px}h1{font-size:clamp(36px,6vw,60px);margin:10px 0}h2{margin-top:0}p{line-height:1.8}.eyebrow{letter-spacing:.17em;font-size:13px;font-weight:700;color:#648276}.lead{color:#526c60}
.nav,.subnav{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0}.subnav{margin:0 0 6px}.nav button,.subnav button{border:1px solid #cbd8ce;border-radius:30px;padding:11px 20px;font-weight:700;cursor:pointer;background:white;color:#19483a}.subnav button{padding:8px 16px;font-size:14px}.nav button[aria-selected=true],.subnav button[aria-selected=true]{background:#19614e;color:white}
.card{padding:26px;border:1px solid #e3e3d9;border-radius:20px;background:white;box-shadow:0 7px 22px #142f2310;margin:16px 0}.pill{display:inline-block;background:#e5efe8;border-radius:15px;padding:5px 12px;font-size:13px;font-weight:700}.pill.warn{background:#fff0cf;color:#6d4d18}.pill.off{background:#eee;color:#555}.pill.bad{background:#fde3df;color:#8a2a1c}
.detail{border-bottom:1px solid #eee;padding:12px 0}.detail strong{display:inline-block;width:96px}.muted{color:#61786e;font-size:14px}.notice{background:#fff0cf;border-radius:12px;padding:13px 17px;color:#6d4d18}.ok{background:#e5efe8;border-radius:12px;padding:13px 17px;color:#19483a}.err{color:#a3301f}.empty{padding:30px;text-align:center}.title{font-size:25px;margin:12px 0}
.authbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-height:44px;margin:18px 0 0}button.link,button.btn{border:1px solid #cbd8ce;border-radius:30px;padding:8px 16px;background:white;color:#19483a;font-weight:700;cursor:pointer}button.primary{background:#19614e;color:white;border-color:#19614e}button.danger{color:#a3301f;border-color:#e8b9b1}button:disabled{opacity:.5;cursor:not-allowed}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:14px}form.grid .full{grid-column:1/-1}label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}input,select,textarea{font:inherit;font-weight:400;padding:9px 11px;border:1px solid #cbd8ce;border-radius:10px;background:white;color:#173c31}textarea{min-height:70px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.radio{flex-direction:row;align-items:center;font-weight:400;gap:6px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top}th{color:#61786e;font-weight:700}.scroll{overflow-x:auto}code{font-size:12px;word-break:break-all}
footer{text-align:center;color:#75877c;font-size:13px;margin-top:40px}@media(max-width:560px){main{padding:22px 14px}.card{padding:20px}form.grid{grid-template-columns:1fr}}</style></head><body><main><div class="eyebrow">DJHS / ACTIVITY HUB</div><h1>讓學習<br>從行動開始。</h1><p class="lead">大甲國中活動報名平台｜講座、學習活動及校內研習集中查看。</p><div class="authbar" id="authbar" aria-live="polite"></div><nav class="nav" aria-label="功能分頁"><button aria-selected="true" id="tab-events" onclick="choose('events')">活動列表</button><button aria-selected="false" id="tab-mine" onclick="choose('mine')">我的報名</button><button aria-selected="false" id="tab-admin" onclick="choose('admin')">管理後台</button></nav><div id="content" aria-live="polite"><div class="card">正在讀取活動資料…</div></div><footer>臺中市立大甲國民中學 · 教務處教學組 · <a href="/privacy">隱私權說明</a></footer></main><script>
const box=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={priority:['優先錄取',''],lottery_pool:['抽籤候選','warn'],selected:['抽籤錄取',''],not_selected:['未錄取','bad'],cancelled:['已取消','off'],pending:['處理中','warn']};
const ACT={draft:'草稿',open:'開放中',closed:'已關閉',drawn:'已抽籤',archived:'已封存'};
const WD='日一二三四五六';
function fmt(iso){if(!iso)return'';const d=new Date(Date.parse(iso)+8*3600e3);const p=n=>String(n).padStart(2,'0');return d.getUTCFullYear()+'/'+p(d.getUTCMonth()+1)+'/'+p(d.getUTCDate())+'（'+WD[d.getUTCDay()]+'）'+p(d.getUTCHours())+':'+p(d.getUTCMinutes());}
function parts(iso){const d=new Date(Date.parse(iso)+8*3600e3).toISOString();return{date:d.slice(0,10),time:d.slice(11,16)};}
async function api(path,opts={}){const init={cache:'no-store',...opts};if(opts.body!==undefined){init.method=opts.method||'POST';init.headers={'content-type':'application/json'};init.body=JSON.stringify(opts.body);}const r=await fetch(path,init);const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||('HTTP '+r.status));return x;}
let page='events',adminPage='manage',authCfg={authEnabled:false},me=null,authMsg='',activities=[],serverNow='',loaded=false,error='',flash={};
function choose(p){page=p;for(const key of ['events','mine','admin'])document.getElementById('tab-'+key).setAttribute('aria-selected',String(key===p));render();}
function render(){if(page==='events')return renderEvents();if(page==='mine')return renderMine();return renderAdmin();}
function gate(title){if(!authCfg.authEnabled)return'<section class="card"><h2>'+title+'</h2><p class="notice">Google 身分驗證尚未設定完成，本區暫未開放。</p></section>';if(!me)return'<section class="card"><h2>'+title+'</h2><p>請先使用學校 Google 帳號（@st.tc.edu.tw 或 @tjjh.tc.edu.tw）登入。</p></section>';return'';}

// ---------- 活動列表與報名 ----------
async function loadActivities(){try{const x=await api('/api/activities');activities=x.activities||[];serverNow=x.now;loaded=true;error='';}catch(e){error=e.message;}if(page==='events')renderEvents();}
function windowState(a){if(a.status==='drawn')return['已抽籤','off'];if(a.status==='closed'||serverNow>=a.deadline_at)return['報名已截止','off'];if(serverNow<a.opens_at)return['尚未開放報名','warn'];return['報名中',''];}
function renderEvents(){if(error){box.innerHTML='<section class="card"><p>活動資料暫時無法載入，請稍後再試。</p><p class="muted">'+esc(error)+'</p></section>';return;}if(!loaded){box.innerHTML='<section class="card">正在讀取活動資料…</section>';return;}if(!activities.length){box.innerHTML='<section class="card empty"><h2>目前尚無開放報名活動</h2><p class="muted">由管理員建立並開放活動後才會出現。</p></section>';return;}
box.innerHTML=activities.map(a=>{const [label,cls]=windowState(a);const canReg=label==='報名中';let action='';const f=flash[a.id];if(f)action+='<p class="'+(f.ok?'ok':'notice err')+'">'+esc(f.msg)+'</p>';
if(canReg){if(!authCfg.authEnabled)action+='<p class="notice">報名系統設定中，暫不接受報名。</p>';else if(!me)action+='<p class="notice">請先在上方使用學校 Google 帳號登入後報名。</p>';else action+=regForm(a);}else if(label==='尚未開放報名')action+='<p class="notice">將於 '+fmt(a.opens_at)+' 開放報名。</p>';
return'<section class="card"><span class="pill '+cls+'">'+label+'</span><h2 class="title">'+esc(a.title)+'</h2>'+(a.description?'<p>'+esc(a.description)+'</p>':'')+'<div class="detail"><strong>講師</strong>'+esc(a.speaker)+'</div><div class="detail"><strong>活動時間</strong>'+fmt(a.starts_at)+' – '+fmt(a.ends_at).slice(-5)+'</div><div class="detail"><strong>地點</strong>'+esc(a.venue)+'</div><div class="detail"><strong>參加對象</strong>'+esc(a.audience)+'</div><div class="detail"><strong>名額</strong>依報名順序優先錄取 '+Number(a.priority_quota)+' 班；其餘於截止後抽籤錄取 '+Number(a.lottery_quota)+' 班</div><div class="detail"><strong>報名期間</strong>'+fmt(a.opens_at)+' 至 '+fmt(a.deadline_at)+'</div><div class="detail"><strong>目前報名</strong>'+Number(a.registered_count)+' 班</div>'+action+'</section>';}).join('');}
function regForm(a){const opt=(arr)=>arr.map(v=>'<option>'+v+'</option>').join('');const nums=Array.from({length:30},(_,i)=>String(i+1).padStart(2,'0'));
return'<form class="grid" onsubmit="submitReg(event,\''+a.id+'\')"><label>年級<select name="grade" required><option value="">請選擇</option><option value="7">七年級</option><option value="8">八年級</option><option value="9">九年級</option></select></label><label>班別<select name="num" required><option value="">請選擇</option>'+opt(nums)+'</select></label><label>導師姓名<input name="teacher_name" maxlength="30" required value="'+esc(me.name)+'"></label><div><strong style="font-size:14px">是否隨班</strong><div class="row" style="margin-top:8px"><label class="radio"><input type="radio" name="accompany" value="yes" required>是</label><label class="radio"><input type="radio" name="accompany" value="no">否</label></div></div><label class="full">備註（選填）<textarea name="notes" maxlength="200"></textarea></label><div class="full row"><button class="btn primary" type="submit">送出報名</button><span class="muted">以 '+esc(me.email)+' 送出；同一班級只能有一筆有效報名，送出後如需更正請洽教學組。</span></div></form>';}
async function submitReg(ev,id){ev.preventDefault();const f=ev.target;const fd=new FormData(f);const code=fd.get('grade')+fd.get('num');if(!confirm('確認以 '+code+' 班報名？送出後無法自行修改。'))return;const btn=f.querySelector('button[type=submit]');btn.disabled=true;
try{const x=await api('/api/registrations',{body:{activity_id:id,class_code:code,teacher_name:fd.get('teacher_name'),accompany:fd.get('accompany'),notes:fd.get('notes')}});const st=STATUS[x.registration.status][0];flash[id]={ok:true,msg:code+' 班報名成功：'+st+(x.registration.status==='lottery_pool'?'（截止後抽籤，結果請至「我的報名」查看）':'')};}catch(e){flash[id]={ok:false,msg:'報名失敗：'+e.message};btn.disabled=false;}await loadActivities();}

// ---------- 我的報名 ----------
async function renderMine(){const g=gate('我的報名');if(g){box.innerHTML=g;return;}box.innerHTML='<section class="card"><h2>我的報名</h2><p>讀取中…</p></section>';
try{const {registrations:rs}=await api('/api/my/registrations');if(page!=='mine')return;box.innerHTML='<section class="card"><h2>我的報名</h2><p class="muted">已登入：'+esc(me.name)+'（'+esc(me.email)+'）</p>'+(rs.length?rs.map(r=>{const [l,c]=STATUS[r.status]||[r.status,''];return'<div class="detail"><span class="pill '+c+'">'+l+'</span> <strong style="width:auto">'+esc(r.class_code)+' 班</strong>｜'+esc(r.title)+'<div class="muted">活動：'+fmt(r.starts_at)+'，'+esc(r.venue)+'｜報名時間 '+fmt(r.submitted_at)+(r.status==='lottery_pool'?'｜將於 '+fmt(r.deadline_at)+' 截止後抽籤':'')+'</div></div>';}).join(''):'<p>尚無報名紀錄。</p>')+'</section>';}catch(e){box.innerHTML='<section class="card"><h2>我的報名</h2><p class="err">'+esc(e.message)+'</p></section>';}}

// ---------- 管理後台 ----------
const ADMIN_PAGES=[['manage','活動管理'],['create','建立活動'],['list','報名名單'],['draw','抽籤作業']];let adminActs=[],selected='',editing=null,adminMsg='';
function adminShell(inner){return'<section class="card"><h2>管理後台</h2><nav class="subnav">'+ADMIN_PAGES.map(([k,l])=>'<button aria-selected="'+(adminPage===k)+'" onclick="goAdmin(\''+k+'\')">'+l+'</button>').join('')+'</nav>'+(adminMsg?'<p class="ok">'+esc(adminMsg)+'</p>':'')+'</section>'+inner;}
function goAdmin(k,keepMsg){adminPage=k;if(!keepMsg)adminMsg='';if(k!=='create')editing=null;renderAdmin();}
async function renderAdmin(){const g=gate('管理後台');if(g){box.innerHTML=g;return;}if(!me.isAdmin){box.innerHTML='<section class="card"><h2>管理後台</h2><p class="notice">此帳號（'+esc(me.email)+'）沒有管理員權限。</p></section>';return;}
try{adminActs=(await api('/api/admin/activities')).activities;}catch(e){box.innerHTML=adminShell('<section class="card err">'+esc(e.message)+'</section>');return;}if(page!=='admin')return;
if(!selected&&adminActs.length)selected=adminActs[0].id;
if(adminPage==='manage')box.innerHTML=adminShell(manageView());else if(adminPage==='create')box.innerHTML=adminShell(activityForm(editing));else if(adminPage==='list')await listView();else await drawView();}
function manageView(){if(!adminActs.length)return'<section class="card empty"><p>尚未建立任何活動。</p><button class="btn primary" onclick="goAdmin(\'create\')">建立活動</button></section>';
return adminActs.map(a=>{const b=(label,fn,cls='')=>'<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>';const acts=[];
if(['draft','open','closed'].includes(a.status)&&!a.lottery_at)acts.push(b('編輯',"editAct('"+a.id+"')"));if(a.status==='draft')acts.push(b('開放報名',"setStatus('"+a.id+"','open','開放後教師即可在報名期間內報名。確定開放？')",'primary'),b('封存',"setStatus('"+a.id+"','archived','確定封存？')",'danger'));
if(a.status==='open')acts.push(b('關閉報名',"setStatus('"+a.id+"','closed','關閉後教師無法報名。確定？')",'danger'));if(a.status==='closed')acts.push(b('重新開放',"setStatus('"+a.id+"','open','確定重新開放？')"),b('封存',"setStatus('"+a.id+"','archived','確定封存？')",'danger'));if(a.status==='drawn')acts.push(b('封存',"setStatus('"+a.id+"','archived','確定封存？')",'danger'));
acts.push(b('報名名單',"selected='"+a.id+"';goAdmin('list')"),b('抽籤作業',"selected='"+a.id+"';goAdmin('draw')"));
return'<section class="card"><span class="pill '+(a.status==='open'?'':'off')+'">'+ACT[a.status]+'</span><h3 class="title">'+esc(a.title)+'</h3><div class="muted">活動 '+fmt(a.starts_at)+'｜報名 '+fmt(a.opens_at)+' 至 '+fmt(a.deadline_at)+'｜優先 '+a.priority_quota+' 班、抽籤 '+a.lottery_quota+' 班</div><p>優先錄取 <b>'+a.priority_count+'</b>／抽籤候選 <b>'+a.pool_count+'</b>／抽籤錄取 <b>'+a.selected_count+'</b>／未錄取 <b>'+a.not_selected_count+'</b>／已取消 <b>'+a.cancelled_count+'</b></p><div class="row">'+acts.join('')+'</div></section>';}).join('');}
function activityForm(a){const v=k=>esc(a?a[k]:'');const dt=(k,label)=>{const p=a?parts(a[k+'_at']):{date:'',time:''};return'<label>'+label+'日期<input type="date" name="'+k+'_date" required value="'+p.date+'"></label><label>'+label+'時間<input type="time" name="'+k+'_time" required value="'+p.time+'"></label>';};
return'<section class="card"><h3>'+(a?'編輯：'+esc(a.title):'建立活動')+'</h3><p class="muted">時間一律為臺灣時間。新活動會先存為「草稿」，確認無誤後再到「活動管理」開放報名。抽籤前都可以修改；修改名額時，系統會依報名順序重新計算優先錄取。'+(a?'':' <button class="btn" type="button" onclick="presetDefault()">填入「自律學習力」預設值</button>')+'</p><form class="grid" id="actform" onsubmit="saveAct(event)"><label class="full">活動名稱<input name="title" maxlength="100" required value="'+v('title')+'"></label><label>講師<input name="speaker" maxlength="100" value="'+v('speaker')+'"></label><label>地點<input name="venue" maxlength="100" value="'+v('venue')+'"></label><label class="full">參加對象<input name="audience" maxlength="100" value="'+v('audience')+'"></label><label class="full">活動說明<textarea name="description" maxlength="2000">'+v('description')+'</textarea></label>'+dt('starts','活動開始')+dt('ends','活動結束')+dt('opens','開放報名')+dt('deadline','報名截止')+'<label>優先錄取名額（班）<input type="number" name="priority_quota" min="0" max="100" required value="'+(a?a.priority_quota:15)+'"></label><label>增額抽籤名額（班）<input type="number" name="lottery_quota" min="0" max="100" required value="'+(a?a.lottery_quota:3)+'"></label><div class="full row"><button class="btn primary" type="submit">'+(a?'儲存修改':'建立草稿')+'</button><span class="err" id="formerr"></span></div></form></section>';}
function presetDefault(){const f=document.getElementById('actform');const set=(k,v)=>f.elements[k].value=v;set('title','自律學習力');set('speaker','陳怡嘉老師（嘉嘉老師）');set('venue','鎮瀾文化大樓');set('audience','七、八、九年級，以班級為單位');set('starts_date','2026-11-12');set('starts_time','14:00');set('ends_date','2026-11-12');set('ends_time','16:00');set('opens_date','2026-10-16');set('opens_time','08:00');set('deadline_date','2026-11-06');set('deadline_time','12:00');set('priority_quota',15);set('lottery_quota',3);}
function editAct(id){editing=adminActs.find(a=>a.id===id);goAdmin('create');}
async function saveAct(ev){ev.preventDefault();const fd=new FormData(ev.target);const body=Object.fromEntries(fd.entries());body.priority_quota=Number(body.priority_quota);body.lottery_quota=Number(body.lottery_quota);const btn=ev.target.querySelector('button[type=submit]');btn.disabled=true;
try{if(editing){const old=adminActs.find(x=>x.id===editing.id);const active=old?old.priority_count+old.pool_count:0;if(active&&body.priority_quota!==old.priority_quota&&!confirm('優先錄取名額由 '+old.priority_quota+' 改為 '+body.priority_quota+'，系統會依報名順序重新計算。'+(body.priority_quota<old.priority_quota?'部分原本「優先錄取」的班級會改為「抽籤候選」。':'')+'確定儲存？')){btn.disabled=false;return;}await api('/api/admin/activities/'+editing.id,{method:'PUT',body});adminMsg='已儲存修改。';}else{await api('/api/admin/activities',{body});adminMsg='已建立草稿，請確認內容後按「開放報名」。';}editing=null;goAdmin('manage',true);}catch(e){document.getElementById('formerr').textContent=e.message;btn.disabled=false;}}
async function setStatus(id,status,question){if(!confirm(question))return;try{await api('/api/admin/activities/'+id+'/status',{body:{status}});adminMsg='活動狀態已更新為「'+ACT[status]+'」。';}catch(e){adminMsg='';alert(e.message);}renderAdmin();loadActivities();}
function picker(){return'<label>選擇活動<select onchange="selected=this.value;renderAdmin()">'+adminActs.map(a=>'<option value="'+a.id+'"'+(a.id===selected?' selected':'')+'>'+esc(a.title)+'（'+ACT[a.status]+'）</option>').join('')+'</select></label>';}
async function listView(){if(!adminActs.length){box.innerHTML=adminShell('<section class="card">尚未建立任何活動。</section>');return;}const x=await api('/api/admin/activities/'+selected+'/registrations');if(page!=='admin'||adminPage!=='list')return;const rs=x.registrations;
const rows=rs.map((r,i)=>{const [l,c]=STATUS[r.status]||[r.status,''];return'<tr><td>'+(i+1)+'</td><td><b>'+esc(r.class_code)+'</b></td><td>'+esc(r.teacher_name)+'<div class="muted">'+esc(r.teacher_email)+'</div></td><td>'+(r.accompany==='yes'?'是':'否')+'</td><td><span class="pill '+c+'">'+l+'</span>'+(r.draw_rank?'<div class="muted">抽籤序 '+r.draw_rank+'</div>':'')+'</td><td>'+fmt(r.submitted_at)+'</td><td>'+esc(r.notes)+'</td><td>'+(r.status!=='cancelled'?'<button class="btn danger" onclick="cancelReg(\''+r.id+'\',\''+esc(r.class_code)+'\')">取消</button>':'')+'</td></tr>';}).join('');
box.innerHTML=adminShell('<section class="card"><div class="row" style="justify-content:space-between">'+picker()+'<a class="btn" href="/api/admin/activities/'+selected+'/registrations.csv">下載 CSV</a></div><p class="muted">共 '+rs.length+' 筆，依伺服器收到的時間排序。抽籤前取消某班時，抽籤候選中最早報名的班級會自動遞補為優先錄取；被取消的班級可以重新報名（排在最後）。</p><div class="scroll"><table><thead><tr><th>#</th><th>班級</th><th>導師</th><th>隨班</th><th>狀態</th><th>報名時間</th><th>備註</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="8">尚無報名</td></tr>')+'</tbody></table></div></section>');}
async function cancelReg(rid,code){const reason=prompt('取消 '+code+' 班的報名（抽籤前取消時，最早的抽籤候選班級會自動遞補）。請輸入原因，會記錄在稽核紀錄：');if(reason===null)return;try{await api('/api/admin/activities/'+selected+'/registrations/'+rid+'/cancel',{body:{reason}});adminMsg=code+' 班報名已取消。';}catch(e){alert(e.message);}renderAdmin();loadActivities();}
async function drawView(){if(!adminActs.length){box.innerHTML=adminShell('<section class="card">尚未建立任何活動。</section>');return;}const x=await api('/api/admin/activities/'+selected+'/registrations');if(page!=='admin'||adminPage!=='draw')return;const a=x.activity,rs=x.registrations;const pool=rs.filter(r=>r.status==='lottery_pool');const now=new Date().toISOString();let body;
if(x.lottery){const L=x.lottery;body='<p class="ok">已於 '+fmt(L.at)+' 由 '+esc(L.by)+' 完成抽籤。候選 '+L.pool.length+' 班，抽出 '+L.selected.length+' 班：<b>'+L.selected.map(esc).join('、')+'</b></p><p class="muted">演算法：'+esc(L.algorithm)+'</p><p class="muted">隨機種子（可供重算驗證）：<code>'+esc(L.seed)+'</code></p><div class="scroll"><table><thead><tr><th>抽籤序</th><th>班級</th><th>結果</th></tr></thead><tbody>'+L.pool.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p.class_code)+'</td><td>'+(L.selected.includes(p.class_code)?'錄取':'未錄取')+'</td></tr>').join('')+'</tbody></table></div>';}
else{const ready=now>=a.deadline_at&&['open','closed'].includes(a.status);body='<p>報名截止：'+fmt(a.deadline_at)+'｜增額名額 '+a.lottery_quota+' 班｜目前抽籤候選 <b>'+pool.length+'</b> 班'+(pool.length?'：'+pool.map(r=>esc(r.class_code)).join('、'):'')+'</p>'+(ready?'<p class="notice">抽籤只能執行一次，結果會立即寫入並無法重抽。</p><button class="btn primary" onclick="doDraw(\''+a.id+'\','+pool.length+','+a.lottery_quota+')">執行抽籤</button>':'<p class="notice">'+(a.status==='draft'?'活動尚未開放。':'報名截止後才能抽籤。')+'</p>');}
box.innerHTML=adminShell('<section class="card">'+picker()+'<h3>'+esc(a.title)+'</h3>'+body+'</section>');}
async function doDraw(id,n,q){if(!confirm('將從 '+n+' 班候選中抽出最多 '+q+' 班。抽籤只能執行一次，確定執行？'))return;try{const r=(await api('/api/admin/activities/'+id+'/draw',{body:{}})).result;adminMsg='抽籤完成：'+(r.selected.length?r.selected.join('、'):'無候選班級');}catch(e){alert(e.message);}renderAdmin();loadActivities();}

// ---------- 登入 ----------
function renderAuth(){const bar=document.getElementById('authbar');if(!authCfg.authEnabled){bar.innerHTML='';return;}if(me){bar.innerHTML='<span class="muted">已登入：'+esc(me.email)+(me.isAdmin?'（管理員）':'')+'</span><button class="link" onclick="logout()">登出</button>';return;}bar.innerHTML='<div id="gsi"></div>'+(authMsg?'<span class="err">'+esc(authMsg)+'</span>':'');startGoogle();}
let gsiLoading=null;function loadGsi(){return gsiLoading||(gsiLoading=new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=ok;s.onerror=()=>fail(Error('無法載入 Google 登入元件'));document.head.appendChild(s);}));}
async function startGoogle(){try{await loadGsi();const {nonce}=await api('/api/auth/nonce');google.accounts.id.initialize({client_id:authCfg.googleClientId,nonce,callback:onCredential,auto_select:false,context:'signin'});const el=document.getElementById('gsi');if(el)google.accounts.id.renderButton(el,{theme:'outline',size:'large',text:'signin_with',locale:'zh-TW'});}catch(e){authMsg=e.message;document.getElementById('authbar').innerHTML='<span class="err">'+esc(authMsg)+'</span>';}}
async function onCredential(resp){authMsg='';try{me=(await api('/api/auth/google',{body:{credential:resp.credential}})).user;}catch(e){authMsg=e.message;}renderAuth();render();}
async function logout(){await api('/api/auth/logout',{body:{}}).catch(()=>{});me=null;if(window.google)google.accounts.id.disableAutoSelect();renderAuth();render();}

loadActivities();
Promise.all([api('/api/config'),api('/api/me')]).then(([c,m])=>{authCfg=c;me=m.user;renderAuth();render();}).catch(()=>{});
</script></body></html>
